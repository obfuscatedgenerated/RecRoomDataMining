// ---------------------------------------------------------------------------
// Shape viewer: maker pen shapes drawn in 3D
// ---------------------------------------------------------------------------

const BOX_FACES = [[0, 1, 3, 2], [4, 6, 7, 5], [0, 4, 5, 1], [2, 3, 7, 6], [0, 2, 6, 4], [1, 5, 7, 3]];
const SHAPE_LIGHT = normalizeVector([0.35, 0.85, 0.4]);

function normalizeVector(vector) {
  const length = Math.hypot(...vector) || 1;
  return vector.map((component) => component / length);
}

function subtractVectors(first, second) {
  return [first[0] - second[0], first[1] - second[1], first[2] - second[2]];
}

function dotVectors(first, second) {
  return first[0] * second[0] + first[1] * second[1] + first[2] * second[2];
}

function crossVectors(first, second) {
  return [first[1] * second[2] - first[2] * second[1], first[2] * second[0] - first[0] * second[2], first[0] * second[1] - first[1] * second[0]];
}

function multiplyMatrices(first, second) {
  return first.map((row) => [0, 1, 2].map((column) => row[0] * second[0][column] + row[1] * second[1][column] + row[2] * second[2][column]));
}

function applyMatrix(matrix, vector) {
  return matrix.map((row) => row[0] * vector[0] + row[1] * vector[1] + row[2] * vector[2]);
}

// Unity euler angles in degrees, applied Z, then X, then Y.
function unityEulerMatrix(euler) {
  const [x, y, z] = [euler.x, euler.y, euler.z].map((degrees) => (degrees * Math.PI) / 180);
  const rotateX = [[1, 0, 0], [0, Math.cos(x), -Math.sin(x)], [0, Math.sin(x), Math.cos(x)]];
  const rotateY = [[Math.cos(y), 0, Math.sin(y)], [0, 1, 0], [-Math.sin(y), 0, Math.cos(y)]];
  const rotateZ = [[Math.cos(z), -Math.sin(z), 0], [Math.sin(z), Math.cos(z), 0], [0, 0, 1]];
  return multiplyMatrices(rotateY, multiplyMatrices(rotateX, rotateZ));
}

// Unity is left-handed; flipping z gives a right-handed view without mirroring the scene.
function toRenderSpace(unityPoint) {
  return [unityPoint[0], unityPoint[1], -unityPoint[2]];
}

function shapeColorRgb(colorIndex) {
  const hue = ((colorIndex * 47) % 360) / 360;
  const saturation = 0.45;
  const lightness = 0.6;
  const channel = (offset) => {
    const position = (hue * 12 + offset) % 12;
    return lightness - saturation * Math.min(lightness, 1 - lightness) * Math.max(-1, Math.min(position - 3, 9 - position, 1));
  };
  return [channel(0), channel(8), channel(4)];
}

function parseShape(shape, index) {
  const position = vectorOf(shape.get("current_local_position")) || { x: 0, y: 0, z: 0 };
  const rotation = vectorOf(shape.get("current_local_rotation")) || { x: 0, y: 0, z: 0 };
  const rawScale = shape.get("scale");
  const scale = rawScale ? rawScale : 1;
  const mesh = shape.get("mesh_shape_data");
  const curve = shape.get("curve_shape_data");
  const aspect = vectorOf(mesh?.get("aspect_ratio")) || vectorOf(mesh?.get("legacy_scale"));
  const size = aspect && (aspect.x || aspect.y || aspect.z)
    ? { x: (aspect.x || 1) * scale, y: (aspect.y || 1) * scale, z: (aspect.z || 1) * scale }
    : { x: scale, y: scale, z: scale };
  const controlPoints = (curve?.get("control_points") || []).map((point) => ({
    position: vectorOf(point.get("position")) || { x: 0, y: 0, z: 0 },
    radius: point.get("radius") ?? 0.05,
  }));
  return {
    index,
    type: shape.get("shape_type") ?? 0,
    color: shape.get("shape_color") ?? 0,
    material: shape.get("shape_material") ?? 0,
    position,
    rotation,
    scale,
    size,
    isCurve: controlPoints.length > 0,
    controlPoints,
    flatShaded: curve?.get("flat_shaded") === true,
  };
}

function buildShapeScene(shapes) {
  const boxes = [];
  const curves = [];
  const allPoints = [];
  for (const shape of shapes) {
    const matrix = unityEulerMatrix(shape.rotation);
    const origin = [shape.position.x, shape.position.y, shape.position.z];
    const toWorld = (local) => toRenderSpace(applyMatrix(matrix, local).map((component, axis) => component + origin[axis]));
    if (shape.isCurve) {
      const points = shape.controlPoints.map((point) => ({
        position: toWorld([point.position.x * shape.scale, point.position.y * shape.scale, point.position.z * shape.scale]),
        radius: point.radius * shape.scale,
      }));
      curves.push({ shape, points });
      allPoints.push(...points.map((point) => point.position));
    } else {
      const half = [shape.size.x / 2, shape.size.y / 2, shape.size.z / 2];
      const corners = [];
      for (const signX of [-1, 1]) for (const signY of [-1, 1]) for (const signZ of [-1, 1]) {
        corners.push(toWorld([signX * half[0], signY * half[1], signZ * half[2]]));
      }
      boxes.push({ shape, corners, center: toRenderSpace(origin) });
      allPoints.push(...corners);
    }
  }
  const minimum = [0, 1, 2].map((axis) => Math.min(...allPoints.map((point) => point[axis])));
  const maximum = [0, 1, 2].map((axis) => Math.max(...allPoints.map((point) => point[axis])));
  const center = minimum.map((value, axis) => (value + maximum[axis]) / 2);
  const radius = Math.max(Math.hypot(...subtractVectors(maximum, minimum)) / 2, 0.01);
  return { boxes, curves, center, radius };
}

function drawShapeScene(canvas, scene, camera, selectedIndex) {
  const pixelRatio = window.devicePixelRatio || 1;
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  if (!width || !height) return;
  canvas.width = Math.round(width * pixelRatio);
  canvas.height = Math.round(height * pixelRatio);
  const context = canvas.getContext("2d");
  context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  context.clearRect(0, 0, width, height);

  const fieldOfView = (50 * Math.PI) / 180;
  const focal = height / 2 / Math.tan(fieldOfView / 2);
  const target = scene.center;
  const eye = [
    target[0] + camera.distance * Math.cos(camera.pitch) * Math.sin(camera.yaw),
    target[1] + camera.distance * Math.sin(camera.pitch),
    target[2] + camera.distance * Math.cos(camera.pitch) * Math.cos(camera.yaw),
  ];
  const forward = normalizeVector(subtractVectors(target, eye));
  const right = normalizeVector(crossVectors(forward, [0, 1, 0]));
  const up = crossVectors(right, forward);
  const toCamera = (point) => {
    const offset = subtractVectors(point, eye);
    return [dotVectors(offset, right), dotVectors(offset, up), dotVectors(offset, forward)];
  };
  const project = (cameraPoint) => [width / 2 + (cameraPoint[0] / cameraPoint[2]) * focal, height / 2 - (cameraPoint[1] / cameraPoint[2]) * focal];
  const near = scene.radius * 0.01;

  const drawables = [];
  for (const box of scene.boxes) {
    const base = shapeColorRgb(box.shape.color);
    for (const face of BOX_FACES) {
      const points = face.map((cornerIndex) => box.corners[cornerIndex]);
      const faceCenter = [0, 1, 2].map((axis) => points.reduce((sum, point) => sum + point[axis], 0) / 4);
      const normal = normalizeVector(subtractVectors(faceCenter, box.center));
      if (dotVectors(normal, subtractVectors(faceCenter, eye)) >= 0) continue;
      const cameraPoints = points.map(toCamera);
      if (cameraPoints.some((point) => point[2] <= near)) continue;
      const brightness = 0.55 + 0.45 * Math.max(0, dotVectors(normal, SHAPE_LIGHT));
      drawables.push({
        depth: cameraPoints.reduce((sum, point) => sum + point[2], 0) / 4,
        draw: () => {
          context.beginPath();
          cameraPoints.map(project).forEach(([screenX, screenY], index) => (index ? context.lineTo(screenX, screenY) : context.moveTo(screenX, screenY)));
          context.closePath();
          context.fillStyle = `rgb(${base.map((channel) => Math.round(channel * brightness * 255)).join(",")})`;
          context.fill();
          const isSelected = box.shape.index === selectedIndex;
          context.strokeStyle = isSelected ? getComputedStyle(canvas).getPropertyValue("--selection-strong") || "#3874b8" : "rgba(0, 0, 0, 0.35)";
          context.lineWidth = isSelected ? 2 : 0.5;
          context.stroke();
        },
      });
    }
  }
  for (const curve of scene.curves) {
    const base = shapeColorRgb(curve.shape.color);
    const cameraPoints = curve.points.map((point) => ({ point: toCamera(point.position), radius: point.radius }));
    for (let index = 0; index < cameraPoints.length - 1; index++) {
      const start = cameraPoints[index];
      const end = cameraPoints[index + 1];
      if (start.point[2] <= near || end.point[2] <= near) continue;
      const depth = (start.point[2] + end.point[2]) / 2;
      drawables.push({
        depth,
        draw: () => {
          const [startX, startY] = project(start.point);
          const [endX, endY] = project(end.point);
          context.beginPath();
          context.moveTo(startX, startY);
          context.lineTo(endX, endY);
          context.lineCap = "round";
          context.lineWidth = Math.max(1, ((start.radius + end.radius) * focal) / depth);
          const isSelected = curve.shape.index === selectedIndex;
          context.strokeStyle = isSelected ? "#3874b8" : `rgb(${base.map((channel) => Math.round(channel * 0.85 * 255)).join(",")})`;
          context.stroke();
        },
      });
    }
  }
  drawables.sort((first, second) => second.depth - first.depth);
  for (const drawable of drawables) drawable.draw();

  // Axis gizmo in the corner, Unity's axes: x red, y green, z blue.
  const gizmoOrigin = [44, height - 44];
  for (const [axis, color] of [[[1, 0, 0], "#d0453c"], [[0, 1, 0], "#3c9a3c"], [[0, 0, -1], "#3c6cd0"]]) {
    const direction = [dotVectors(axis, right), dotVectors(axis, up)];
    context.beginPath();
    context.moveTo(...gizmoOrigin);
    context.lineTo(gizmoOrigin[0] + direction[0] * 26, gizmoOrigin[1] - direction[1] * 26);
    context.strokeStyle = color;
    context.lineWidth = 2;
    context.stroke();
  }
}

function renderShapeViewer(message, key) {
  const shapes = shapeMessagesOf(message).map(parseShape);
  if (shapes.length === 0) return null;
  const scene = buildShapeScene(shapes);
  if (!state.shapeCameras.has(key)) state.shapeCameras.set(key, { yaw: -0.7, pitch: 0.45, distance: scene.radius * 2.6 });
  const camera = state.shapeCameras.get(key);
  const selectedIndex = state.shapeSelection.get(key) ?? null;

  const canvas = el("canvas", { class: "shape-canvas", role: "img", "aria-label": `${shapes.length} maker pen shapes in 3D` });
  const redraw = () => drawShapeScene(canvas, scene, camera, state.shapeSelection.get(key) ?? null);
  let dragStart = null;
  canvas.addEventListener("pointerdown", (event) => {
    dragStart = { x: event.clientX, y: event.clientY, yaw: camera.yaw, pitch: camera.pitch };
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener("pointermove", (event) => {
    if (!dragStart) return;
    camera.yaw = dragStart.yaw - (event.clientX - dragStart.x) * 0.01;
    camera.pitch = Math.max(-1.5, Math.min(1.5, dragStart.pitch + (event.clientY - dragStart.y) * 0.01));
    redraw();
  });
  canvas.addEventListener("pointerup", () => { dragStart = null; });
  canvas.addEventListener("wheel", (event) => {
    event.preventDefault();
    camera.distance = Math.max(scene.radius * 0.2, Math.min(scene.radius * 20, camera.distance * Math.exp(event.deltaY * 0.001)));
    redraw();
  }, { passive: false });
  canvas.addEventListener("dblclick", () => {
    Object.assign(camera, { yaw: -0.7, pitch: 0.45, distance: scene.radius * 2.6 });
    redraw();
  });
  requestAnimationFrame(redraw);
  if (typeof ResizeObserver === "function") new ResizeObserver(redraw).observe(canvas);

  const selectShape = (index) => {
    state.shapeSelection.set(key, selectedIndex === index ? null : index);
    render();
  };
  const rows = shapes.map((shape) => clickableRow(() => selectShape(shape.index),
    { class: shape.index === selectedIndex ? "is-highlighted" : "" },
    el("td", { class: "index-cell" }, shape.index),
    el("td", {}, shape.isCurve ? `curve, ${shape.controlPoints.length} points` : `type ${shape.type}`),
    el("td", {}, el("span", { class: "type-swatch", style: `background: rgb(${shapeColorRgb(shape.color).map((channel) => Math.round(channel * 255)).join(",")})` }), shape.color),
    el("td", { class: "index-cell" }, shape.material),
    el("td", {}, el("span", { class: "value kind-number" }, formatVector(shape.position))),
    el("td", {}, el("span", { class: "value kind-number" }, formatVector(shape.rotation))),
    el("td", {}, el("span", { class: "value kind-number" }, shape.isCurve ? `scale ${formatNumber(shape.scale)}` : `${formatNumber(shape.size.x)} × ${formatNumber(shape.size.y)} × ${formatNumber(shape.size.z)}`)),
  ));

  return el("div", { class: "shape-viewer" },
    el("div", { class: "node-header" },
      el("h2", { class: "node-title" }, `Shapes (${shapes.length})`),
      el("span", { class: "node-meta" }, "Local to the object. Solid shapes are drawn as boxes of their size, and colours are approximate."),
    ),
    el("div", { class: "shape-canvas-frame" }, canvas, el("div", { class: "circuit-hint" }, "Drag to rotate, scroll to zoom, double-click to reset")),
    el("div", { class: "scroll-x table-scroll" }, el("table", { class: "data" },
      el("thead", {}, el("tr", {},
        el("th", {}, "#"), el("th", {}, "Shape"), el("th", {}, "Colour"), el("th", {}, "Material"),
        el("th", {}, "Position"), el("th", {}, "Rotation"), el("th", {}, "Size"))),
      el("tbody", {}, rows))),
  );
}

// Explore shows the viewer above the fields of any message that holds shapes.
function shapeViewerForExplore(message, path) {
  if (!["rec_room.PersistenceViewData", "rec_room.ShapeContainerData", "rec_room.ShapeDataCollectionData"].includes(message.typeName)) return null;
  if (shapeMessagesOf(message).length === 0) return null;
  return renderShapeViewer(message, pathToText(path));
}

// ---------------------------------------------------------------------------
// Schema tab

function renderSchema() {
  const schema = state.schema;
  const query = state.schemaView.query.trim().toLowerCase();
  const allTypes = [...schema.messages.values(), ...schema.enums.values()]
    .filter((type) => !type.fullName.startsWith("google.") && !(type.kind === "message" && type.isMapEntry));
  const matching = allTypes
    .filter((type) => !query || type.fullName.toLowerCase().includes(query))
    .sort((first, second) => {
      const firstCount = state.analysis?.typeCounts.get(first.fullName) || 0;
      const secondCount = state.analysis?.typeCounts.get(second.fullName) || 0;
      return secondCount - firstCount || first.fullName.localeCompare(second.fullName);
    });

  const listItems = matching.slice(0, SCHEMA_LIST_LIMIT).map((type) => {
    const count = state.analysis?.typeCounts.get(type.fullName);
    return el("button", {
      class: "result-item collection-item",
      "aria-current": String(type.fullName === state.schemaView.selectedTypeName),
      onclick: () => {
        state.schemaView.selectedTypeName = type.fullName;
        render();
      },
    },
    el("span", { class: "collection-pattern" }, type.fullName),
    el("span", { class: "collection-type" }, type.kind === "enum" ? "enum" : `${type.fields.length} fields`),
    el("span", { class: "collection-count" }, count ? count.toLocaleString() : ""));
  });

  const sidebar = el("aside", { class: "panel sidebar" },
    el("h3", {}, "Types"),
    el("input", {
      class: "text-input",
      type: "search",
      placeholder: "Filter types",
      value: state.schemaView.query,
      "aria-label": "Filter types",
      oninput: (event) => {
        state.schemaView.query = event.target.value;
        rerenderPreservingFocus(".sidebar input[type=search]");
      },
    }),
    el("div", { class: "result-note" }, state.analysis
      ? "Numbers show how many times each type appears in the loaded file."
      : `${matching.length} types`),
    el("div", { class: "sidebar-scroll" },
      listItems,
      matching.length > SCHEMA_LIST_LIMIT ? el("div", { class: "result-note" }, `${matching.length - SCHEMA_LIST_LIMIT} more. Narrow the filter to see them.`) : null),
  );

  return el("div", { class: "split" }, sidebar, renderSchemaType());
}

function renderSchemaType() {
  const typeName = state.schemaView.selectedTypeName;
  const type = typeName ? state.schema.messages.get(typeName) || state.schema.enums.get(typeName) : null;
  if (!type) return el("div", { class: "panel empty-note" }, "Pick a type to see its fields.");

  const count = state.analysis?.typeCounts.get(type.fullName) || 0;
  const header = el("div", { class: "node-header" },
    el("h2", { class: "node-title" }, type.name),
    el("span", { class: "field-type" }, type.fullName),
    el("span", { class: "node-meta" }, type.fileName),
    el("div", { class: "node-actions" },
      state.root && type.kind === "message" ? el("span", { class: "node-meta" }, `${count.toLocaleString()} in this file`) : null,
      state.root && type.kind === "message" && count > 0 ? el("button", {
        class: "button is-small",
        onclick: () => {
          state.search.includeTypes = true;
          state.tab = "explore";
          runSearch(type.name);
        },
      }, "Find in file") : null,
    ),
  );

  if (type.kind === "enum") {
    return el("div", { class: "panel" }, header, el("div", { class: "enum-values" },
      type.values.map((value) => el("div", {}, el("span", {}, value.number), value.name))));
  }

  const usedBy = [];
  for (const candidate of state.schema.messages.values()) {
    if (candidate.fields.some((field) => field.typeName === type.fullName)) usedBy.push(candidate.fullName);
  }

  return el("div", { class: "panel" },
    header,
    el("div", { class: "scroll-x" }, el("table", { class: "data" },
      el("thead", {}, el("tr", {}, el("th", {}, "#"), el("th", {}, "Field"), el("th", {}, "Type"))),
      el("tbody", {}, type.fields.map((field) => el("tr", {},
        el("td", { class: "index-cell" }, field.number),
        el("td", {}, el("span", { class: "field-name" }, field.name), field.explicitOptional ? el("span", { class: "field-number" }, "optional") : null),
        el("td", {}, renderFieldType(field))))))),
    usedBy.length > 0 ? el("div", { class: "bytes-section" },
      el("h3", {}, "Used by"),
      el("div", { class: "guess-list" }, usedBy.sort().map((name) => el("button", { class: "field-chip", onclick: () => openSchemaType(name) }, shortTypeName(name))))) : null,
  );
}

// ---------------------------------------------------------------------------
// Root render
// ---------------------------------------------------------------------------

// Re-rendering replaces the whole page, so remember where each scrolling list was and put it back.
const SCROLL_CONTAINER_SELECTOR = ".sidebar-scroll, .table-scroll, .scroll-x";

function saveScrollPositions() {
  const positions = new Map();
  document.querySelectorAll(SCROLL_CONTAINER_SELECTOR).forEach((container, index) => {
    positions.set(container.dataset.scrollKey || `${index}`, { top: container.scrollTop, left: container.scrollLeft });
  });
  return { positions, windowTop: window.scrollY };
}

function restoreScrollPositions(saved, resetPage) {
  document.querySelectorAll(SCROLL_CONTAINER_SELECTOR).forEach((container, index) => {
    container.dataset.scrollKey = `${state.tab}:${index}`;
    const position = saved.positions.get(container.dataset.scrollKey);
    if (position && !(resetPage && !container.classList.contains("sidebar-scroll"))) {
      container.scrollTop = position.top;
      container.scrollLeft = position.left;
    }
  });
  window.scrollTo({ top: resetPage ? 0 : saved.windowTop });
}

function render() {
  const app = document.getElementById("app");
  const savedScroll = saveScrollPositions();
  const resetPage = state.resetScroll === true;
  state.resetScroll = false;
  if (!state.root && !(state.tab === "schema" && state.schema)) state.tab = "explore";

  let content;
  if (state.tab === "schema" && state.schema) content = renderSchema();
  else if (!state.root) content = renderIntro();
  else if (state.tab === "collections") content = renderCollections();
  else if (state.tab === "circuits") content = renderCircuits();
  else if (state.tab === "objects") content = renderObjects();
  else content = renderExplore();

  app.replaceChildren(
    renderHeader(),
    el("main", {}, content),
    el("footer", { class: `status-bar${state.status.isError ? " is-error" : ""}`, role: "status" },
      el("span", { class: "status-line" }, state.status.text || "Ready")),
  );
  restoreScrollPositions(savedScroll, resetPage);
}

// ---------------------------------------------------------------------------
// Files hosted next to the page
// ---------------------------------------------------------------------------

// Tried in order, relative to this page. Override with ?schema=, ?prefabs= and ?data= in the page URL.
const BUNDLED_SCHEMA_PATHS = ["descriptor_set.binpb", "schema/descriptor_set.binpb", "data/descriptor_set.binpb"];
const BUNDLED_PREFAB_PATHS = ["prefab_registry.csv", "data/prefab_registry.csv", "prefabs/prefab_registry.csv"];

async function fetchFirstAvailable(paths) {
  for (const path of paths) {
    try {
      const response = await fetch(path, { cache: "no-cache" });
      if (response.ok) return { path, bytes: new Uint8Array(await response.arrayBuffer()) };
    } catch (error) {
      // Not hosted here, or opened from disk where the browser blocks this.
    }
  }
  return null;
}

async function loadBundledFiles() {
  const parameters = new URLSearchParams(window.location.search);
  const schemaPaths = parameters.get("schema") ? [parameters.get("schema")] : BUNDLED_SCHEMA_PATHS;
  const prefabPaths = parameters.get("prefabs") ? [parameters.get("prefabs")] : BUNDLED_PREFAB_PATHS;
  const loaded = [];

  const schemaFile = await fetchFirstAvailable(schemaPaths);
  if (schemaFile && !state.schema) {
    const schema = tryParseDescriptorSet(schemaFile.bytes);
    if (schema) {
      state.schema = schema;
      state.schemaFileName = `${schemaFile.path} (with this page)`;
      state.bundledSources.schema = schemaFile.path;
      loaded.push(`the schema (${schema.messages.size} message types)`);
    }
  }

  const prefabFile = await fetchFirstAvailable(prefabPaths);
  if (prefabFile) {
    const names = tryParsePrefabCsv(prefabFile.path, prefabFile.bytes);
    if (names) {
      state.bundledPrefabNames = names;
      state.bundledSources.prefabs = prefabFile.path;
      loaded.push(`${names.size.toLocaleString()} prefab names`);
    }
  }

  if (parameters.get("data")) {
    const dataFile = await fetchFirstAvailable([parameters.get("data")]);
    if (dataFile) {
      state.dataBytes = dataFile.bytes;
      state.dataFileName = dataFile.path.split("/").pop();
      state.bundledSources.data = dataFile.path;
    } else {
      setStatus(`Couldn't load ${parameters.get("data")} from the page URL.`, true);
    }
  }

  if (loaded.length > 0) setStatus(`Loaded ${loaded.join(" and ")} from this page's folder. Open a room file to start.`);
  if (state.schema && state.dataBytes && !state.root) {
    state.rootTypeName = state.schema.guessTypeForFileName(state.dataFileName)
      || (state.schema.messages.has("rec_room.PersistedRoomData") ? "rec_room.PersistedRoomData" : null);
    decodeDocument();
    return;
  }
  render();
}

function setupDragAndDrop() {
  let dragDepth = 0;
  const zoneClass = (isHovering) => document.body.classList.toggle("is-drag-over", isHovering);
  window.addEventListener("dragenter", (event) => {
    event.preventDefault();
    dragDepth++;
    zoneClass(true);
  });
  window.addEventListener("dragleave", () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) zoneClass(false);
  });
  window.addEventListener("dragover", (event) => event.preventDefault());
  window.addEventListener("drop", (event) => {
    event.preventDefault();
    dragDepth = 0;
    zoneClass(false);
    if (event.dataTransfer?.files?.length) loadFiles(event.dataTransfer.files);
  });
}

state.chipLabels = loadChipLabels();
state.prefabNames = loadStoredPrefabNames();
setupDragAndDrop();
render();
loadBundledFiles();

</script>
