// ---------------------------------------------------------------------------
// Explore tab
// ---------------------------------------------------------------------------

function renderExplore() {
  return el("div", { class: "split" }, renderSearchSidebar(), renderNodeView());
}

function renderSearchSidebar() {
  const queryInput = el("input", {
    class: "text-input",
    type: "search",
    placeholder: "Name, text, GUID, number…",
    value: state.search.query,
    "aria-label": "Search the room data",
  });
  const form = el("form", {
    class: "search-form",
    onsubmit: (event) => {
      event.preventDefault();
      runSearch(queryInput.value);
    },
  }, queryInput, el("button", { class: "button", type: "submit" }, "Search"));

  const options = el("div", { class: "search-options" },
    el("label", {}, el("input", {
      type: "checkbox",
      checked: state.search.includeNames,
      onchange: (event) => { state.search.includeNames = event.target.checked; },
    }), "Field names"),
    el("label", {}, el("input", {
      type: "checkbox",
      checked: state.search.includeTypes,
      onchange: (event) => { state.search.includeTypes = event.target.checked; },
    }), "Type names"),
  );

  let resultsContent;
  if (state.search.results === null) {
    resultsContent = el("div", { class: "result-note" }, "Search matches field names, type names, text, enum values, GUIDs and exact numbers.");
  } else if (state.search.results.length === 0) {
    resultsContent = el("div", { class: "result-note" }, `Nothing matches "${state.search.query}".`);
  } else {
    resultsContent = [
      el("div", { class: "result-note" },
        state.search.truncated ? `Showing the first ${state.search.results.length} matches.` : `${state.search.results.length} ${state.search.results.length === 1 ? "match" : "matches"}.`),
      state.search.results.map((result) => el("button", {
        class: "result-item",
        onclick: () => navigateTo(result.path, result.fieldNumber),
      },
      el("div", { class: "result-path" }, pathToText(result.path)),
      el("div", { class: "result-text" }, result.kind === "type" ? `is a ${shortTypeName(result.text)}` : result.text))),
    ];
  }

  return el("aside", { class: "panel sidebar" },
    el("h3", {}, "Search"),
    form,
    options,
    el("div", { class: "sidebar-scroll" }, resultsContent),
  );
}

function runSearch(query) {
  state.search.query = query;
  const { results, truncated } = searchDocument(state.root, query, {
    includeNames: state.search.includeNames,
    includeTypes: state.search.includeTypes,
    limit: 500,
  });
  state.search.results = results;
  state.search.truncated = truncated;
  render();
}

function renderBreadcrumb(path) {
  const crumbs = [];
  crumbs.push({ label: shortTypeName(state.rootTypeName), path: [] });
  for (let index = 0; index < path.length; index++) {
    const step = path[index];
    let label;
    if (step.decodeAs !== undefined) label = `as ${step.decodeAs ? shortTypeName(step.decodeAs) : "raw"}`;
    else if (step.index === -1) label = step.name;
    else if (step.repeated) label = `[${step.index}]`;
    else label = step.name;
    const previous = path[index - 1];
    // A list item crumb follows its list crumb; show the field name once.
    if (step.repeated && step.index !== -1 && !(previous && previous.fieldNumber === step.fieldNumber && previous.index === -1)) {
      crumbs.push({ label: step.name, path: [...path.slice(0, index), { ...step, index: -1 }] });
    }
    crumbs.push({ label, path: path.slice(0, index + 1) });
  }
  const items = [];
  crumbs.forEach((crumb, crumbIndex) => {
    if (crumbIndex > 0) items.push(el("span", { class: "crumb-separator", "aria-hidden": "true" }, "/"));
    const isCurrent = crumbIndex === crumbs.length - 1;
    items.push(el("button", {
      class: "crumb",
      "aria-current": isCurrent ? "page" : null,
      onclick: isCurrent ? null : () => navigateTo(crumb.path),
    }, crumb.label));
  });
  return el("nav", { class: "breadcrumb", "aria-label": "Location in the file" }, items);
}

function normalizedPath(path) {
  // Make sure list-item steps coming from lists keep their repeated flag.
  return path.map((step) => ({ ...step }));
}

function renderNodeView() {
  const path = normalizedPath(state.explorer.path);
  let node;
  try {
    node = resolvePath(state.root, path, state.schema);
  } catch (error) {
    return el("section", { class: "node-view" },
      renderBreadcrumb(path),
      el("div", { class: "panel empty-note" }, `Couldn't open this location: ${error.message}`),
    );
  }

  let body;
  if (node.kind === "message") body = renderMessageNode(node, path);
  else if (node.kind === "list") body = renderListNode(node, path);
  else if (node.kind === "bytes") body = renderBytesNode(node, path);
  else body = renderScalarNode(node);

  return el("section", { class: "node-view" }, renderBreadcrumb(path), body);
}

function renderMessageNode(node, path) {
  const message = node.value;
  const entries = message.orderedEntries();
  const rows = [];

  const entriesByNumber = new Map(entries.map((entry) => [entry.number, entry]));
  const fieldOrder = [];
  if (message.type) {
    for (const field of message.type.fields) {
      if (entriesByNumber.has(field.number)) fieldOrder.push({ entry: entriesByNumber.get(field.number) });
      else if (state.explorer.showUnset) fieldOrder.push({ unsetField: field });
    }
  }
  for (const entry of entries) {
    if (!entry.field) fieldOrder.push({ entry });
  }

  for (const item of fieldOrder) {
    if (item.unsetField) rows.push(renderUnsetRow(item.unsetField));
    else rows.push(renderEntryRow(item.entry, path));
  }

  const typeName = message.type ? message.type.fullName : null;
  const header = el("div", { class: "node-header" },
    el("h2", { class: "node-title" }, message.type ? message.type.name : "Raw message"),
    typeName ? el("button", { class: "type-link", onclick: () => openSchemaType(typeName) }, typeName) : null,
    el("span", { class: "node-meta" }, `${entries.length} fields set, ${formatByteSize(message.bytes.length)}`),
    el("div", { class: "node-actions" },
      message.type ? el("label", {}, el("input", {
        type: "checkbox",
        checked: state.explorer.showUnset,
        onchange: (event) => {
          state.explorer.showUnset = event.target.checked;
          render();
        },
      }), "Show unset fields") : null,
      el("button", { class: "button is-small", onclick: () => copyJson(message, null, "JSON") }, "Copy JSON"),
    ),
  );

  const decodedNote = node.decodedAs !== undefined
    ? el("div", { class: "decoded-note" }, node.decodedAs
      ? `These bytes were decoded as ${node.decodedAs}. If the values look wrong, go back and try another type.`
      : "Decoded without a schema. Field names are unknown, so fields show their numbers and wire types.")
    : null;

  const table = rows.length > 0
    ? el("div", { class: "scroll-x" }, el("table", { class: "data" },
      el("thead", {}, el("tr", {}, el("th", {}, "Field"), el("th", {}, "Type"), el("th", {}, "Value"))),
      el("tbody", {}, rows)))
    : el("div", { class: "empty-note" }, "This message has no fields set. Every field is at its default value.");

  const panel = el("div", { class: "panel" }, header, decodedNote, shapeViewerForExplore(message, path), table);
  requestAnimationFrame(() => panel.querySelector("tr.is-highlighted")?.scrollIntoView({ block: "center" }));
  return panel;
}

function renderUnsetRow(field) {
  return el("tr", { class: "is-unset" },
    el("td", {}, el("span", { class: "field-name" }, field.name), el("span", { class: "field-number" }, `#${field.number}`)),
    el("td", {}, renderFieldType(field)),
    el("td", {}, el("span", { class: "value" }, "unset")),
  );
}

function renderFieldType(field) {
  const typeText = `${field.repeated && !state.schema.isMapField(field) ? "repeated " : ""}${state.schema.describeFieldType(field)}`;
  const isLinkable = (field.type === FieldType.MESSAGE || field.type === FieldType.ENUM) && field.typeName && !state.schema.isMapField(field);
  const typeElement = isLinkable
    ? el("button", {
      class: "type-link",
      onclick: (event) => {
        event.stopPropagation();
        openSchemaType(field.typeName);
      },
    }, typeText)
    : el("span", { class: "field-type" }, typeText);
  return el("span", { class: "field-type" }, typeElement, field.oneofName ? el("span", { class: "field-oneof" }, `oneof ${field.oneofName}`) : null);
}

function renderEntryRow(entry, path) {
  const field = entry.field;
  const isHighlighted = state.explorer.highlightFieldNumber === entry.number;
  const nameCell = el("td", {},
    el("span", { class: "field-name" }, field ? field.name : `#${entry.number}`),
    el("span", { class: "field-number" }, `#${entry.number}`),
  );
  const typeCell = el("td", {}, field ? renderFieldType(field) : el("span", { class: "field-type" }, `unknown (${WIRE_TYPE_LABELS[entry.wireType] || entry.wireType})`));
  const isRepeated = field ? field.repeated : entry.values.length > 1;

  if (isRepeated) {
    const firstValues = entry.values.slice(0, 4);
    const allScalar = firstValues.every((value) => !(value instanceof DecodedMessage) && !(value instanceof Uint8Array));
    const preview = allScalar
      ? firstValues.map((value) => (field ? summarizeValue(value, field) : describeUnknownValue(value, entry.wireType))).join(", ") + (entry.values.length > 4 ? ", …" : "")
      : summarizeValue(entry.values[0], field);
    const valueCell = el("td", {},
      el("span", { class: "value kind-list" }, `${entry.values.length.toLocaleString()} ${entry.values.length === 1 ? "item" : "items"}`),
      el("span", { class: "drill-mark", "aria-hidden": "true" }, "▸"),
      el("div", { class: `value ${kindClassFor(entry.values[0], field)}` }, preview),
    );
    return clickableRow(
      () => navigateTo([...path, { ...makeStep(entry, -1), repeated: true }]),
      { class: isHighlighted ? "is-highlighted" : "" },
      nameCell, typeCell, valueCell,
    );
  }

  const value = entry.values[entry.values.length - 1];
  const kind = valueKind(value);
  const summary = field ? summarizeValue(value, field) : describeUnknownValue(value, entry.wireType);
  const valueCell = el("td", {},
    el("span", { class: `value ${kindClassFor(value, field)}` }, summary),
    kind === "message" || kind === "bytes" ? el("span", { class: "drill-mark", "aria-hidden": "true" }, "▸") : null,
  );
  const rowProps = { class: isHighlighted ? "is-highlighted" : "" };
  if (kind === "message" || kind === "bytes") {
    const step = { ...makeStep(entry, entry.values.length - 1), repeated: false };
    return clickableRow(() => navigateTo([...path, step]), rowProps, nameCell, typeCell, valueCell);
  }
  return el("tr", rowProps, nameCell, typeCell, valueCell);
}

function renderListNode(node, path) {
  const entry = node.value;
  const field = entry.field;
  const listStep = path[path.length - 1];
  const filterText = state.explorer.listFilter.trim().toLowerCase();

  const matchingIndexes = [];
  for (let index = 0; index < entry.values.length; index++) {
    if (!filterText) {
      matchingIndexes.push(index);
      continue;
    }
    const summary = field ? summarizeValue(entry.values[index], field) : describeUnknownValue(entry.values[index], entry.wireType);
    if (summary.toLowerCase().includes(filterText) || String(index) === filterText) matchingIndexes.push(index);
  }
  const visibleIndexes = matchingIndexes.slice(0, state.explorer.listLimit);

  const rows = visibleIndexes.map((index) => {
    const value = entry.values[index];
    const kind = valueKind(value);
    const summary = field ? summarizeValue(value, field) : describeUnknownValue(value, entry.wireType);
    const cells = [
      el("td", { class: "index-cell" }, index),
      el("td", {},
        el("span", { class: `value ${kindClassFor(value, field)}` }, summary),
        kind === "message" || kind === "bytes" ? el("span", { class: "drill-mark", "aria-hidden": "true" }, "▸") : null,
      ),
    ];
    if (kind === "message" || kind === "bytes") {
      const step = { ...listStep, index, repeated: true };
      return clickableRow(() => navigateTo([...path.slice(0, -1), step]), {}, cells);
    }
    return el("tr", {}, cells);
  });

  const filterInput = el("input", {
    class: "text-input",
    type: "search",
    placeholder: "Filter items by their summary or index",
    value: state.explorer.listFilter,
    "aria-label": "Filter list items",
    oninput: (event) => {
      state.explorer.listFilter = event.target.value;
      state.explorer.listLimit = LIST_PAGE_SIZE;
      rerenderPreservingFocus(".list-toolbar input");
    },
  });

  const header = el("div", { class: "node-header" },
    el("h2", { class: "node-title" }, field ? field.name : `#${entry.number}`),
    field ? renderFieldType(field) : null,
    el("span", { class: "node-meta" }, `${entry.values.length.toLocaleString()} items`),
    el("div", { class: "node-actions" },
      el("button", { class: "button is-small", onclick: () => copyJson(entry.values.map((value) => toPlainValue(value, field)), null, "JSON") }, "Copy JSON"),
    ),
  );

  const remaining = matchingIndexes.length - visibleIndexes.length;
  const footer = el("div", { class: "list-footer" },
    `Showing ${visibleIndexes.length.toLocaleString()} of ${matchingIndexes.length.toLocaleString()}${filterText ? " matching" : ""}.`,
    remaining > 0 ? el("button", {
      class: "button is-small",
      onclick: () => {
        state.explorer.listLimit += LIST_PAGE_SIZE;
        render();
      },
    }, `Show ${Math.min(remaining, LIST_PAGE_SIZE)} more`) : null,
  );

  return el("div", { class: "panel" },
    header,
    el("div", { class: "list-toolbar" }, filterInput),
    rows.length > 0
      ? el("div", { class: "scroll-x" }, el("table", { class: "data" },
        el("thead", {}, el("tr", {}, el("th", {}, "#"), el("th", {}, "Value"))),
        el("tbody", {}, rows)))
      : el("div", { class: "empty-note" }, "No items match this filter."),
    footer,
  );
}

function renderScalarNode(node) {
  return el("div", { class: "panel" },
    el("div", { class: "node-header" }, el("h2", { class: "node-title" }, node.field ? node.field.name : "Value")),
    el("div", { class: "empty-note" }, el("span", { class: `value ${kindClassFor(node.value, node.field)}` }, summarizeValue(node.value, node.field))),
  );
}

function renderHexDump(bytes) {
  const lines = [];
  const length = Math.min(bytes.length, HEX_DUMP_LIMIT);
  for (let offset = 0; offset < length; offset += 16) {
    const slice = bytes.subarray(offset, Math.min(offset + 16, length));
    const hexPart = [...slice].map((byte) => byte.toString(16).padStart(2, "0")).join(" ").padEnd(47, " ");
    const asciiPart = [...slice].map((byte) => (byte >= 32 && byte < 127 ? String.fromCharCode(byte) : "·")).join("");
    lines.push(el("span", { class: "hex-offset" }, offset.toString(16).padStart(6, "0")), "  ", hexPart, "  ", el("span", { class: "hex-ascii" }, asciiPart), "\n");
  }
  if (bytes.length > length) lines.push(el("span", { class: "hex-offset" }, `… ${formatByteSize(bytes.length - length)} more`));
  return el("pre", { class: "hexdump" }, lines);
}

function textPreviewFor(bytes) {
  if (bytes.length === 0) return null;
  const sample = bytes.subarray(0, 8192);
  let controlBytes = 0;
  for (const byte of sample) {
    if ((byte < 32 && byte !== 9 && byte !== 10 && byte !== 13) || byte === 127) controlBytes++;
  }
  if (controlBytes > sample.length * 0.01) return null;
  return new TextDecoder("utf-8", { fatal: false }).decode(sample);
}

function renderBytesNode(node, path) {
  const bytes = node.value;
  const field = node.field;
  const guid = bytesToGuidString(bytes);
  const textPreview = textPreviewFor(bytes);

  const typeInput = el("input", {
    class: "text-input",
    list: "message-types",
    placeholder: "Message type to decode these bytes as",
    "aria-label": "Message type for these bytes",
  });
  const decodeAs = (typeName) => navigateTo([...path, { decodeAs: typeName }]);
  const detectedType = buildCircuitModel().detectedDecodes.get(bytes);

  const decodeSection = el("div", { class: "bytes-section" },
    el("h3", {}, "Decode as a message"),
    detectedType ? el("div", { class: "decode-row" },
      el("button", { class: "button is-primary", onclick: () => decodeAs(detectedType) }, `Decode as ${shortTypeName(detectedType)}`),
      el("span", { class: "node-meta" }, "These are Circuits V1 graphs. They also appear in the Circuits tab."),
    ) : null,
    el("div", { class: "decode-row", style: detectedType ? "margin-top: 10px" : null },
      typeInput,
      el("button", {
        class: "button",
        onclick: () => {
          const typeName = typeInput.value.trim();
          if (!state.schema.messages.has(typeName)) {
            showToast(`${typeName || "That"} isn't a message type in this schema`);
            return;
          }
          tryDecodeBytes(bytes, typeName, () => decodeAs(typeName));
        },
      }, "Decode"),
      el("button", { class: "button", onclick: () => tryDecodeBytes(bytes, "", () => decodeAs("")) }, "Decode without schema"),
      el("button", {
        class: "button",
        onclick: () => {
          state.explorer.guesses = guessMessageTypes(bytes, state.schema);
          render();
        },
      }, "Suggest types"),
    ),
    state.explorer.guesses
      ? (state.explorer.guesses.length > 0
        ? el("div", { class: "guess-list" }, state.explorer.guesses.map((guess) => el("button", {
          class: "field-chip",
          onclick: () => decodeAs(guess.typeName),
          title: `${guess.knownFields} fields decoded, no unknown fields`,
        }, shortTypeName(guess.typeName), el("span", { class: "chip-count" }, guess.knownFields))))
        : el("p", { class: "node-meta" }, "No message type decodes these bytes cleanly. They may be compressed, encrypted or not protobuf."))
      : null,
  );

  return el("div", { class: "panel" },
    el("div", { class: "node-header" },
      el("h2", { class: "node-title" }, field ? field.name : "Bytes"),
      el("span", { class: "node-meta" }, `${bytes.length.toLocaleString()} bytes`),
      el("div", { class: "node-actions" },
        el("button", { class: "button is-small", onclick: () => copyText(bytesToHex(bytes).replace(/ /g, ""), "hex") }, "Copy hex"),
        el("button", { class: "button is-small", onclick: () => copyText(bytesToBase64(bytes), "base64") }, "Copy base64"),
      ),
    ),
    guid ? el("div", { class: "bytes-section" }, el("h3", {}, "As a GUID"), el("span", { class: "value kind-guid" }, guid)) : null,
    textPreview ? el("div", { class: "bytes-section" }, el("h3", {}, "As text"), el("pre", { class: "text-preview" }, textPreview)) : null,
    bytes.length > 0 ? decodeSection : null,
    bytes.length > 0 ? el("div", { class: "bytes-section" }, el("h3", {}, "Hex"), renderHexDump(bytes)) : el("div", { class: "empty-note" }, "These bytes are empty."),
  );
}

function tryDecodeBytes(bytes, typeName, onSuccess) {
  try {
    decodeBytesAs(bytes, typeName, state.schema);
    onSuccess();
  } catch (error) {
    showToast(`Couldn't decode as ${typeName ? shortTypeName(typeName) : "raw protobuf"}: ${error.message}`);
  }
}

function rerenderPreservingFocus(selector) {
  const active = document.activeElement;
  const selectionStart = active?.selectionStart;
  render();
  const replacement = document.querySelector(selector);
  if (replacement) {
    replacement.focus();
    if (selectionStart !== undefined && selectionStart !== null) replacement.setSelectionRange(selectionStart, selectionStart);
  }
}

// ---------------------------------------------------------------------------
// Collections tab
// ---------------------------------------------------------------------------

function renderCollections() {
  const collections = [...state.analysis.collections].sort((first, second) => second.items.length - first.items.length);
  if (collections.length === 0) {
    return el("div", { class: "panel empty-note" }, "This file has no repeated messages to list.");
  }
  let selected = collections.find((collection) => collection.pattern === state.collections.pattern);
  if (!selected) {
    selected = collections[0];
    state.collections.pattern = selected.pattern;
  }

  const sidebar = el("aside", { class: "panel sidebar" },
    el("h3", {}, "Lists in this file"),
    el("div", { class: "sidebar-scroll" }, collections.map((collection) => el("button", {
      class: "result-item collection-item",
      "aria-current": String(collection === selected),
      onclick: () => {
        state.collections = { ...state.collections, pattern: collection.pattern, filter: "", requiredFields: new Set(), limit: COLLECTION_PAGE_SIZE };
        render();
      },
    },
    el("span", { class: "collection-pattern" }, collection.pattern),
    el("span", { class: "collection-type" }, shortTypeName(collection.typeName || "?")),
    el("span", { class: "collection-count" }, collection.items.length.toLocaleString())))),
  );

  return el("div", { class: "split" }, sidebar, renderCollectionTable(selected));
}

function fieldPresenceFor(collection) {
  let presence = state.collections.presenceCache.get(collection.pattern);
  if (presence) return presence;
  presence = new Map();
  for (const item of collection.items) {
    for (const entry of item.message.orderedEntries()) {
      const name = entry.field ? entry.field.name : `#${entry.number}`;
      presence.set(name, (presence.get(name) || 0) + 1);
    }
  }
  state.collections.presenceCache.set(collection.pattern, presence);
  return presence;
}

function renderCollectionTable(collection) {
  const presence = fieldPresenceFor(collection);
  const requiredFields = state.collections.requiredFields;
  const filterText = state.collections.filter.trim().toLowerCase();
  const hasWildcards = collection.pattern.includes("[*]");

  const itemFieldNames = (item) => item.message.orderedEntries().map((entry) => (entry.field ? entry.field.name : `#${entry.number}`));

  const matchingItems = collection.items.filter((item) => {
    if (requiredFields.size > 0) {
      const names = new Set(itemFieldNames(item));
      for (const required of requiredFields) if (!names.has(required)) return false;
    }
    if (filterText) {
      const summary = summarizeMessage(item.message).toLowerCase();
      if (!summary.includes(filterText) && !itemFieldNames(item).some((name) => name.includes(filterText))) return false;
    }
    return true;
  });
  const visibleItems = matchingItems.slice(0, state.collections.limit);

  const chips = [...presence.entries()].sort((first, second) => second[1] - first[1]).map(([name, count]) => el("button", {
    class: "field-chip",
    "aria-pressed": String(requiredFields.has(name)),
    title: `${count} of ${collection.items.length} items have ${name}`,
    onclick: () => {
      if (requiredFields.has(name)) requiredFields.delete(name);
      else requiredFields.add(name);
      state.collections.limit = COLLECTION_PAGE_SIZE;
      render();
    },
  }, name, el("span", { class: "chip-count" }, count.toLocaleString())));

  const summaries = visibleItems.map((item) => summarizeMessage(item.message));
  const showSummary = summaries.some((summary) => !summary.startsWith("{ ") && summary !== "empty");
  const rows = visibleItems.map((item, visibleIndex) => {
    const itemPath = collectionItemPath(item);
    const summary = summaries[visibleIndex];
    const fieldNames = itemFieldNames(item);
    return clickableRow(() => navigateTo(itemPath), {},
      el("td", { class: "index-cell" }, hasWildcards ? pathToText(itemPath) : item.index),
      showSummary ? el("td", {}, summary.startsWith("{ ") ? null : el("span", { class: `value ${kindClassFor(item.message, null)}` }, summary)) : null,
      el("td", {}, el("div", { class: "tag-list" },
        fieldNames.slice(0, 8).map((name) => el("span", { class: "tag" }, name)),
        fieldNames.length > 8 ? el("span", { class: "tag" }, `+${fieldNames.length - 8}`) : null)),
    );
  });

  const remaining = matchingItems.length - visibleItems.length;
  return el("div", { class: "panel" },
    el("div", { class: "node-header" },
      el("h2", { class: "node-title" }, collection.pattern),
      collection.typeName ? el("button", { class: "type-link", onclick: () => openSchemaType(collection.typeName) }, collection.typeName) : null,
      el("span", { class: "node-meta" }, `${collection.items.length.toLocaleString()} items`),
    ),
    el("div", { class: "list-toolbar" }, el("input", {
      class: "text-input",
      type: "search",
      placeholder: "Filter by name or field",
      value: state.collections.filter,
      "aria-label": "Filter items",
      oninput: (event) => {
        state.collections.filter = event.target.value;
        state.collections.limit = COLLECTION_PAGE_SIZE;
        rerenderPreservingFocus(".list-toolbar input");
      },
    }), el("span", { class: "node-meta" }, "Pick fields below to show only items that have them.")),
    el("div", { class: "chip-row" }, chips),
    rows.length > 0
      ? el("div", { class: "scroll-x" }, el("table", { class: "data" },
        el("thead", {}, el("tr", {}, el("th", {}, hasWildcards ? "Location" : "#"), showSummary ? el("th", {}, "Summary") : null, el("th", {}, "Fields set"))),
        el("tbody", {}, rows)))
      : el("div", { class: "empty-note" }, "No items match. Clear a field or the filter."),
    el("div", { class: "list-footer" },
      `Showing ${visibleItems.length.toLocaleString()} of ${matchingItems.length.toLocaleString()}.`,
      remaining > 0 ? el("button", {
        class: "button is-small",
        onclick: () => {
          state.collections.limit += COLLECTION_PAGE_SIZE;
          render();
        },
      }, `Show ${Math.min(remaining, COLLECTION_PAGE_SIZE)} more`) : null,
    ),
  );
}

// ---------------------------------------------------------------------------
// Circuits tab
// ---------------------------------------------------------------------------

function guidOf(message, fieldName, deprecatedFieldName) {
  const guidMessage = message.get(fieldName);
  if (guidMessage instanceof DecodedMessage) {
    const guid = guidFromMessage(guidMessage);
    if (guid && guid !== "(empty guid)") return guid;
  }
  const rawBytes = deprecatedFieldName ? message.get(deprecatedFieldName) : null;
  return rawBytes instanceof Uint8Array && rawBytes.length > 0 ? bytesToGuidString(rawBytes) || bytesToHex(rawBytes) : null;
}

let circuitModelCache = null;

const CV1_CONTAINER_TYPES = ["circuits_v1.CircuitNodeGraphCollectionData", "circuits_v1.CircuitNodeGraphData"];
const CV1_GRAPH_TYPE = "circuits_v1.CircuitNodeGraphData";
const CV1_NODE_TYPE = "circuits_v1.CircuitNodeData";

function countMessagesOfType(message, typeName) {
  let unknownFields = 0;
  let matches = 0;
  walkMessage(message, {
    onMessage(inner) {
      if (inner.typeName === typeName) matches++;
    },
    onEntry(owner, entry) {
      if (!entry.field) unknownFields++;
    },
  });
  return { matches, unknownFields };
}

// CV1 circuits are stored as opaque bytes (PersistedRoomData.circuit_data). Find the schema type that decodes them.
function detectCircuitsV1Type(bytes) {
  for (const typeName of CV1_CONTAINER_TYPES) {
    if (!state.schema.messages.has(typeName)) continue;
    try {
      const decoded = decodeBytesAs(bytes, typeName, state.schema);
      const { matches, unknownFields } = countMessagesOfType(decoded, CV1_NODE_TYPE);
      if (matches > 0 && unknownFields === 0) return typeName;
    } catch (error) {
      // Try the next candidate.
    }
  }
  return null;
}

function findCircuitsV1Graphs() {
  const graphs = [];
  const undecodedSources = [];
  const detectedDecodes = new Map();

  const collectGraphs = (message, basePath) => walkMessage(message, {
    onMessage(inner, path) {
      if (inner.typeName === CV1_GRAPH_TYPE) graphs.push({ path: [...basePath, ...copyPath(path)], message: inner });
    },
  });

  collectGraphs(state.root, []);

  const byteSources = [];
  walkMessage(state.root, {
    onValue(value, entry, path) {
      if (value instanceof Uint8Array && value.length > 0 && entry.field?.name === "circuit_data") {
        byteSources.push({ bytes: value, path: copyPath(path) });
      }
    },
  });
  for (const source of byteSources) {
    const typeName = detectCircuitsV1Type(source.bytes);
    if (!typeName) {
      undecodedSources.push(source);
      continue;
    }
    detectedDecodes.set(source.bytes, typeName);
    collectGraphs(decodeBytesAs(source.bytes, typeName, state.schema), [...source.path, { decodeAs: typeName }]);
  }
  return { graphs, undecodedSources, detectedDecodes };
}

// CV1 chips are physical room objects; their persistence views carry circuit_node_id and a world transform.
function findCircuitObjects() {
  const objectsByCircuitId = new Map();
  walkMessage(state.root, {
    onMessage(message, path) {
      if (message.typeName !== "rec_room.PersistenceViewData") return;
      const circuitNodeData = message.get("circuit_node_data");
      if (!(circuitNodeData instanceof DecodedMessage)) return;
      const circuitId = circuitNodeData.get("circuit_node_id") ?? 0;
      if (objectsByCircuitId.has(circuitId)) return;
      const position = message.get("transform")?.get("position");
      objectsByCircuitId.set(circuitId, {
        message,
        path: copyPath(path),
        position: position ? { x: position.get("x") ?? 0, y: position.get("y") ?? 0, z: position.get("z") ?? 0 } : null,
      });
    },
  });
  return objectsByCircuitId;
}

// The prefab a CV1 chip's room object was spawned from identifies it more precisely than its node type.
function prefabIdOf(objectMessage) {
  const prefabBytes = objectMessage?.get("spawnable_tool_data")?.get("prefab_id");
  if (!(prefabBytes instanceof Uint8Array) || prefabBytes.length === 0) return null;
  return bytesToGuidString(prefabBytes) || bytesToHex(prefabBytes).replace(/ /g, "");
}

function describeCircuitsV1Type(nodeType) {
  if (!(nodeType instanceof Uint8Array) || nodeType.length === 0) return null;
  if (nodeType.length === 16) return bytesToGuidString(nodeType);
  const text = new TextDecoder("utf-8", { fatal: false }).decode(nodeType);
  return /^[\x20-\x7e]+$/.test(text) ? text : bytesToHex(nodeType);
}

function isZeroPosition(position) {
  return !position || (position.x === 0 && position.y === 0 && position.z === 0);
}

function buildCircuitsV2Graphs() {
  const boardNameByGraphId = new Map();
  const graphs = state.analysis.circuitGraphs.map(({ path, message }) => {
    const graphId = guidOf(message, "graph_id", "DEPRECATED_graph_id");
    const nodeEntry = message.getEntryByName("node_datas");
    const nodes = (message.get("node_datas") || []).map((node, index) => {
      const graphNodeData = node.get("graph_node_data");
      const innerGraphId = graphNodeData ? guidOf(graphNodeData, "inner_graph_id", "DEPRECATED_inner_graph_id") : null;
      const position = node.get("transform_data")?.get("local_position");
      const chip = {
        index,
        message: node,
        id: guidOf(node, "node_id", "DEPRECATED_node_id") || `index-${index}`,
        name: node.get("node_name") || "",
        typeId: guidOf(node, "node_type", "DEPRECATED_node_type"),
        innerGraphId,
        position: { x: position?.get("x") ?? 0, y: position?.get("y") ?? 0, z: position?.get("z") ?? 0 },
        path: [...path, makeStep(nodeEntry, index)],
        objectPath: null,
        objectMessage: null,
      };
      if (innerGraphId) boardNameByGraphId.set(innerGraphId, chip.name || "Circuit board");
      return chip;
    });
    const edges = (message.get("edges") || []).map((edge) => ({
      sourceId: guidOf(edge, "src_node_id", "DEPRECATED_src_node_id"),
      sourceGroup: edge.get("src_port_group_id") ?? 0,
      sourcePort: edge.get("src_port_id") ?? 0,
      targetId: guidOf(edge, "dst_node_id", "DEPRECATED_dst_node_id"),
      targetGroup: edge.get("dst_port_group_id") ?? 0,
      targetPort: edge.get("dst_port_id") ?? 0,
    }));
    const depth = path.filter((step) => step.name === "child_graphs").length;
    return { version: 2, id: graphId, path, message, nodes, edges, depth };
  });
  for (const graph of graphs) {
    graph.title = graph.depth === 0 ? "Room circuits" : boardNameByGraphId.get(graph.id) || `Board ${graph.id ? graph.id.slice(0, 8) : "?"}`;
  }
  return graphs;
}

function buildCircuitsV1Graphs(sources, objectsByCircuitId) {
  const graphIdByMessage = new Map();
  sources.forEach(({ path, message }) => {
    const guidBytes = message.get("node_graph_guid");
    const guid = guidBytes instanceof Uint8Array && guidBytes.length > 0 ? bytesToGuidString(guidBytes) || bytesToHex(guidBytes) : null;
    graphIdByMessage.set(message, guid ? `v1:${guid}` : `v1:${pathToText(path)}`);
  });

  const boardNameByGraphId = new Map();
  const graphs = sources.map(({ path, message }) => {
    const graphId = graphIdByMessage.get(message);
    const nodeEntry = message.getEntryByName("circuit_nodes");
    const edges = [];
    const seenEdges = new Set();

    const nodes = (message.get("circuit_nodes") || []).map((node, index) => {
      const circuitId = node.get("node_id") ?? 0;
      const linkedObject = objectsByCircuitId.get(circuitId);
      const ownPosition = node.get("transform_data")?.get("position");
      let position = ownPosition ? { x: ownPosition.get("x") ?? 0, y: ownPosition.get("y") ?? 0, z: ownPosition.get("z") ?? 0 } : null;
      if (isZeroPosition(position) && linkedObject?.position) position = linkedObject.position;
      const innerGraph = node.get("internal_graph_data")?.get("internal_node_graph");
      const innerGraphId = innerGraph ? graphIdByMessage.get(innerGraph) || null : null;
      const chip = {
        index,
        message: node,
        id: String(circuitId),
        name: node.get("node_name") || "",
        typeId: describeCircuitsV1Type(node.get("node_type")),
        innerGraphId,
        position: position || { x: 0, y: 0, z: 0 },
        path: [...path, makeStep(nodeEntry, index)],
        objectPath: linkedObject ? linkedObject.path : null,
        objectMessage: linkedObject ? linkedObject.message : null,
        prefabId: prefabIdOf(linkedObject?.message),
      };
      if (innerGraphId) boardNameByGraphId.set(innerGraphId, chip.name || `Chip ${circuitId}`);

      for (const link of node.get("circuit_links") || []) {
        const edge = {
          sourceId: String(link.get("source_node_id") ?? 0),
          sourceGroup: null,
          sourcePort: link.get("output_slot") ?? 0,
          targetId: String(link.get("dest_node_id") ?? 0),
          targetGroup: null,
          targetPort: link.get("input_slot") ?? 0,
          linkType: link.get("link_type") ?? 0,
        };
        const key = `${edge.sourceId}:${edge.sourcePort}>${edge.targetId}:${edge.targetPort}:${edge.linkType}`;
        if (seenEdges.has(key)) continue;
        seenEdges.add(key);
        edges.push(edge);
      }
      return chip;
    });

    const depth = path.filter((step) => step.name === "internal_node_graph").length;
    return { version: 1, id: graphId, path, message, nodes, edges, depth };
  });

  let topLevelNumber = 0;
  for (const graph of graphs) {
    if (graph.depth === 0) {
      topLevelNumber++;
      graph.title = topLevelNumber === 1 ? "Room circuits (CV1)" : `Circuit graph ${topLevelNumber} (CV1)`;
    } else {
      graph.title = boardNameByGraphId.get(graph.id) || "Inner graph";
    }
  }
  return graphs;
}

function buildCircuitModel() {
  if (circuitModelCache && circuitModelCache.root === state.root) return circuitModelCache;
  const circuitsV1 = findCircuitsV1Graphs();
  const objectsByCircuitId = findCircuitObjects();
  const graphs = [...buildCircuitsV2Graphs(), ...buildCircuitsV1Graphs(circuitsV1.graphs, objectsByCircuitId)];
  for (const graph of graphs) {
    for (const chip of graph.nodes) {
      chip.typeKey = chip.prefabId ? `cv1prefab:${chip.prefabId}` : chipTypeKey(graph.version, chip.typeId);
    }
  }
  circuitModelCache = {
    root: state.root,
    graphs,
    undecodedSources: circuitsV1.undecodedSources,
    detectedDecodes: circuitsV1.detectedDecodes,
    circuitObjectCount: objectsByCircuitId.size,
    chipTypes: computeChipTypes(graphs),
  };
  return circuitModelCache;
}

function renderCircuits() {
  const model = buildCircuitModel();
  if (model.graphs.every((graph) => graph.nodes.length === 0)) return renderNoCircuits(model);

  if (state.circuits.graphIndex === null || state.circuits.graphIndex >= model.graphs.length) {
    state.circuits.graphIndex = Math.max(0, model.graphs.findIndex((graph) => graph.nodes.length > 0));
  }
  const graphIndex = state.circuits.graphIndex;
  const graph = model.graphs[graphIndex];

  const graphButton = (candidate, index) => el("button", {
    class: `result-item collection-item ${candidate.depth === 0 ? "" : candidate.depth <= 3 ? `graph-depth-${candidate.depth}` : "graph-depth-deep"}`,
    "aria-current": String(index === graphIndex),
    onclick: () => selectGraph(index),
  },
  el("span", { class: "collection-pattern" }, candidate.title),
  el("span", { class: "collection-type" }, `${candidate.nodes.length} chips, ${candidate.edges.length} wires`),
  el("span", { class: "collection-count" }, ""));

  const sections = [];
  for (const version of [2, 1]) {
    const entries = model.graphs.map((candidate, index) => ({ candidate, index })).filter(({ candidate }) => candidate.version === version);
    if (entries.length === 0) continue;
    sections.push(el("div", { class: "result-note" }, version === 2 ? "Circuits V2" : "Circuits V1"));
    sections.push(entries.map(({ candidate, index }) => graphButton(candidate, index)));
  }

  const sidebar = el("aside", { class: "panel sidebar" },
    el("h3", {}, "Boards"),
    el("div", { class: "sidebar-scroll" }, sections, renderChipTypeList(model)),
  );

  return el("div", { class: "split" }, sidebar, renderCircuitBoard(model, graph));
}

function renderNoCircuits(model) {
  const notes = [el("p", {}, "No circuit chips were found in this file.")];
  for (const source of model.undecodedSources) {
    notes.push(el("p", {},
      `${pathToText(source.path)} holds ${formatByteSize(source.bytes.length)} of circuit data that doesn't decode as the circuits_v1 types in this schema. `,
      el("button", { class: "button is-small", onclick: () => navigateTo(source.path) }, "Inspect the bytes"),
    ));
  }
  if (model.circuitObjectCount > 0) {
    notes.push(el("p", {}, `${model.circuitObjectCount} room objects are CV1 chips (they have circuit_node_data). Find them in Collections by picking the circuit_node_data field.`));
  }
  return el("div", { class: "panel empty-note" }, notes);
}

function selectGraph(index) {
  state.circuits.graphIndex = index;
  state.circuits.selectedNodeId = null;
  state.circuits.transform = null;
  render();
}

function projectPosition(position, axis) {
  if (axis === "xz") return { horizontal: position.x, vertical: -position.z };
  if (axis === "zy") return { horizontal: position.z, vertical: -position.y };
  return { horizontal: position.x, vertical: -position.y };
}

function layoutChips(nodes, axis) {
  const projected = nodes.map((node) => projectPosition(node.position, axis));
  const horizontalValues = projected.map((point) => point.horizontal);
  const verticalValues = projected.map((point) => point.vertical);
  const spanHorizontal = Math.max(...horizontalValues) - Math.min(...horizontalValues);
  const spanVertical = Math.max(...verticalValues) - Math.min(...verticalValues);
  const layout = new Map();

  if (nodes.length === 0) return { layout, usedGrid: false };
  if (!(spanHorizontal > 1e-6 || spanVertical > 1e-6)) {
    const columns = Math.ceil(Math.sqrt(nodes.length));
    nodes.forEach((node, index) => {
      layout.set(node.id, { x: (index % columns) * (CIRCUIT_CHIP_WIDTH + 60), y: Math.floor(index / columns) * (CIRCUIT_CHIP_HEIGHT + 50) });
    });
    return { layout, usedGrid: true };
  }

  const targetSpan = Math.max(900, Math.sqrt(nodes.length) * 260);
  const scale = targetSpan / Math.max(spanHorizontal, spanVertical);
  const minHorizontal = Math.min(...horizontalValues);
  const minVertical = Math.min(...verticalValues);
  nodes.forEach((node, index) => {
    layout.set(node.id, {
      x: (projected[index].horizontal - minHorizontal) * scale,
      y: (projected[index].vertical - minVertical) * scale,
    });
  });
  return { layout, usedGrid: false };
}

function truncateLabel(text, maxLength) {
  return text.length > maxLength ? `${text.slice(0, maxLength - 1)}…` : text;
}

function renderCircuitBoard(model, graph) {
  const { layout, usedGrid } = layoutChips(graph.nodes, state.circuits.axis);
  const nodesById = new Map(graph.nodes.map((node) => [node.id, node]));
  const resolvedEdges = graph.edges.filter((edge) => nodesById.has(edge.sourceId) && nodesById.has(edge.targetId));
  const unresolvedCount = graph.edges.length - resolvedEdges.length;

  const wireLayer = svgEl("g", {});
  const chipLayer = svgEl("g", {});
  const viewport = svgEl("g", {}, wireLayer, chipLayer);
  const svg = svgEl("svg", { role: "img", "aria-label": `Circuit diagram for ${graph.title}` }, viewport);

  const wireElements = resolvedEdges.map((edge) => {
    const start = layout.get(edge.sourceId);
    const end = layout.get(edge.targetId);
    const startX = start.x + CIRCUIT_CHIP_WIDTH / 2;
    const endX = end.x - CIRCUIT_CHIP_WIDTH / 2;
    const handle = Math.max(40, Math.abs(endX - startX) / 2);
    const wire = svgEl("path", {
      class: "wire",
      d: `M ${startX} ${start.y} C ${startX + handle} ${start.y}, ${endX - handle} ${end.y}, ${endX} ${end.y}`,
    });
    wire.dataset.source = edge.sourceId;
    wire.dataset.target = edge.targetId;
    wireLayer.append(wire);
    return wire;
  });

  const chipElements = new Map();
  for (const node of graph.nodes) {
    const position = layout.get(node.id);
    const isBoard = Boolean(node.innerGraphId);
    const chip = svgEl("g", {
      class: `chip-node${isBoard ? " is-board" : ""}`,
      transform: `translate(${position.x - CIRCUIT_CHIP_WIDTH / 2} ${position.y - CIRCUIT_CHIP_HEIGHT / 2})`,
      tabindex: "0",
      role: "button",
      "aria-label": node.name || "Unnamed chip",
    },
    svgEl("rect", { width: CIRCUIT_CHIP_WIDTH, height: CIRCUIT_CHIP_HEIGHT, rx: 2 }),
    svgEl("rect", { class: "chip-stripe", width: 6, height: CIRCUIT_CHIP_HEIGHT - 8, x: 4, y: 4, rx: 2, style: `fill: hsl(${chipTypeHue(node.typeKey)} 65% 55%)` }),
    svgEl("text", { x: 16, y: 17 }, truncateLabel(chipDisplayName(node, graph), 19)),
    svgEl("text", { x: 16, y: 32, class: "chip-sub" }, truncateLabel(chipSubtitle(node), 24)),
    svgEl("title", {}, `${chipDisplayName(node, graph)}\n${node.typeId || ""}`));
    chip.addEventListener("click", (event) => {
      event.stopPropagation();
      selectChip(node.id);
    });
    chip.addEventListener("keydown", (event) => {
      if (event.key === "Enter") selectChip(node.id);
    });
    chip.addEventListener("dblclick", (event) => {
      event.stopPropagation();
      if (node.innerGraphId) openBoard(model, node.innerGraphId);
    });
    chipLayer.append(chip);
    chipElements.set(node.id, chip);
  }

  const infoPanel = el("div", { class: "circuit-info" });

  function applySelection() {
    const selectedId = state.circuits.selectedNodeId;
    const linkedIds = new Set();
    for (const wire of wireElements) {
      const isActive = selectedId && (wire.dataset.source === selectedId || wire.dataset.target === selectedId);
      wire.classList.toggle("is-active", Boolean(isActive));
      if (isActive) {
        linkedIds.add(wire.dataset.source);
        linkedIds.add(wire.dataset.target);
        wire.parentNode.append(wire);
      }
    }
    for (const [nodeId, chip] of chipElements) {
      chip.classList.toggle("is-selected", nodeId === selectedId);
      chip.classList.toggle("is-linked", nodeId !== selectedId && linkedIds.has(nodeId));
      chip.classList.toggle("is-type-match", nodesById.get(nodeId)?.typeKey === state.circuits.selectedTypeKey);
    }
    infoPanel.replaceChildren(...renderChipInfo(model, graph, nodesById));
  }

  function selectChip(nodeId) {
    state.circuits.selectedNodeId = state.circuits.selectedNodeId === nodeId ? null : nodeId;
    applySelection();
  }

  const transform = state.circuits.transform || { scale: 1, translateX: 0, translateY: 0 };
  const applyTransform = () => {
    viewport.setAttribute("transform", `translate(${transform.translateX} ${transform.translateY}) scale(${transform.scale})`);
    state.circuits.transform = transform;
  };

  function fitToView() {
    const width = svg.clientWidth || 800;
    const height = svg.clientHeight || 500;
    if (graph.nodes.length === 0) return;
    const xs = [...layout.values()].map((point) => point.x);
    const ys = [...layout.values()].map((point) => point.y);
    const minX = Math.min(...xs) - CIRCUIT_CHIP_WIDTH;
    const maxX = Math.max(...xs) + CIRCUIT_CHIP_WIDTH;
    const minY = Math.min(...ys) - CIRCUIT_CHIP_HEIGHT * 2;
    const maxY = Math.max(...ys) + CIRCUIT_CHIP_HEIGHT * 2;
    transform.scale = Math.min(2, width / (maxX - minX), height / (maxY - minY));
    transform.translateX = (width - (maxX - minX) * transform.scale) / 2 - minX * transform.scale;
    transform.translateY = (height - (maxY - minY) * transform.scale) / 2 - minY * transform.scale;
    applyTransform();
  }

  svg.addEventListener("wheel", (event) => {
    event.preventDefault();
    const bounds = svg.getBoundingClientRect();
    const cursorX = event.clientX - bounds.left;
    const cursorY = event.clientY - bounds.top;
    const factor = Math.exp(-event.deltaY * 0.0015);
    const newScale = Math.min(8, Math.max(0.02, transform.scale * factor));
    transform.translateX = cursorX - (cursorX - transform.translateX) * (newScale / transform.scale);
    transform.translateY = cursorY - (cursorY - transform.translateY) * (newScale / transform.scale);
    transform.scale = newScale;
    applyTransform();
  }, { passive: false });

  let panStart = null;
  svg.addEventListener("pointerdown", (event) => {
    if (event.target.closest(".chip-node")) return;
    panStart = { pointerX: event.clientX, pointerY: event.clientY, translateX: transform.translateX, translateY: transform.translateY, moved: false };
    svg.setPointerCapture(event.pointerId);
    svg.classList.add("is-panning");
  });
  svg.addEventListener("pointermove", (event) => {
    if (!panStart) return;
    const deltaX = event.clientX - panStart.pointerX;
    const deltaY = event.clientY - panStart.pointerY;
    if (Math.abs(deltaX) + Math.abs(deltaY) > 3) panStart.moved = true;
    transform.translateX = panStart.translateX + deltaX;
    transform.translateY = panStart.translateY + deltaY;
    applyTransform();
  });
  svg.addEventListener("pointerup", () => {
    if (panStart && !panStart.moved && state.circuits.selectedNodeId) {
      state.circuits.selectedNodeId = null;
      applySelection();
    }
    panStart = null;
    svg.classList.remove("is-panning");
  });

  const axisSelect = el("select", {
    class: "text-input",
    "aria-label": "Which position axes to lay chips out on",
    onchange: (event) => {
      state.circuits.axis = event.target.value;
      state.circuits.transform = null;
      render();
    },
  },
  [["xy", "Front (X, Y)"], ["xz", "Top (X, Z)"], ["zy", "Side (Z, Y)"]].map(([value, label]) => el("option", { value, selected: state.circuits.axis === value }, label)));

  const notes = [];
  if (usedGrid) notes.push("Chips have no saved positions, so they're laid out in a grid.");
  if (unresolvedCount > 0) notes.push(`${unresolvedCount} wires connect to chips outside this board and aren't drawn.`);
  if (graph.edges.length === 0 && graph.nodes.length > 1) notes.push("No wires are stored on this graph. Newer saves may keep them in circuit_v2_data.entities.");

  const canvas = el("div", { class: "circuit-canvas" }, svg, el("div", { class: "circuit-hint" }, "Drag to pan, scroll to zoom, click a chip for details"));
  const panel = el("div", { class: "panel" },
    el("div", { class: "circuit-toolbar" },
      el("span", { class: "toolbar-title" }, graph.title),
      el("span", { class: "node-meta" }, `${graph.nodes.length} chips, ${resolvedEdges.length} wires`),
      axisSelect,
      el("button", { class: "button is-small", onclick: fitToView }, "Fit"),
      el("button", { class: "button is-small", onclick: () => navigateTo(graph.path) }, "Open in Explore"),
    ),
    notes.length > 0 ? el("div", { class: "decoded-note" }, notes.join(" ")) : null,
    canvas,
    infoPanel,
  );

  requestAnimationFrame(() => {
    if (state.circuits.transform) applyTransform();
    else fitToView();
    applySelection();
  });
  return panel;
}

function openBoard(model, graphId) {
  const index = model.graphs.findIndex((graph) => graph.id === graphId);
  if (index === -1) {
    showToast("That board's graph isn't in this file");
    return;
  }
  selectGraph(index);
}

function renderChipInfo(model, graph, nodesById) {
  const selectedId = state.circuits.selectedNodeId;
  if (!selectedId) {
    const selectedType = model.chipTypes.get(state.circuits.selectedTypeKey);
    if (selectedType) return [renderChipTypeEditor(selectedType)];

  }
  const node = nodesById.get(selectedId);
  if (!node) return [];

  const configEntries = node.message.orderedEntries().filter((entry) => entry.field && !GENERIC_CHIP_FIELDS.has(entry.field.name) && !entry.field.name.startsWith("DEPRECATED_"));
  const portLabel = (group, port) => (group === null ? `slot ${port}` : `${group}.${port}`);
  const chipLabel = (nodeId) => (nodesById.has(nodeId) ? chipDisplayName(nodesById.get(nodeId), graph) : `Chip ${nodeId}`);
  const describeEnd = (nodeId, group, port) => `${chipLabel(nodeId)} [${portLabel(group, port)}]`;
  const incoming = graph.edges.filter((edge) => edge.targetId === selectedId);

  return [

      el("dt", {}, "Chip ID"), el("dd", {}, node.id),
      el("dt", {}, "Position"), el("dd", {}, `(${formatNumber(node.position.x)}, ${formatNumber(node.position.y)}, ${formatNumber(node.position.z)})`),
      graph.version === 2 ? [el("dt", {}, "Port groups"), el("dd", {}, String((node.message.get("node_groups") || []).length))] : null,
      configEntries.map((entry) => [
        el("dt", {}, entry.field.name),
        el("dd", {}, summarizeValue(entry.values[entry.values.length - 1], entry.field)),
      ]),
    ),
    el("div", { class: "decode-row" },
      el("button", { class: "button is-small", onclick: () => navigateTo(node.path) }, "Open chip in Explore"),
      node.innerGraphId ? el("button", { class: "button is-small", onclick: () => openBoard(model, node.innerGraphId) }, "Open board") : null,
      node.objectPath ? el("button", { class: "button is-small", onclick: () => navigateTo(node.objectPath) }, "Open room object") : null,
      el("button", { class: "button is-small", onclick: () => copyText(node.typeId || "", "chip type") }, "Copy chip type"),
    ),
    incoming.length > 0 ? [el("h3", {}, `Wires in (${incoming.length})`), el("ul", { class: "wire-list" }, incoming.map((edge) => wireItem(
      `${describeEnd(edge.sourceId, edge.sourceGroup, edge.sourcePort)} → [${portLabel(edge.targetGroup, edge.targetPort)}]`,
      edge.sourceId,
      () => { state.circuits.selectedNodeId = edge.sourceId; render(); },
    )))] : null,
    outgoing.length > 0 ? [el("h3", {}, `Wires out (${outgoing.length})`), el("ul", { class: "wire-list" }, outgoing.map((edge) => wireItem(
      `[${portLabel(edge.sourceGroup, edge.sourcePort)}] → ${describeEnd(edge.targetId, edge.targetGroup, edge.targetPort)}`,
      edge.targetId,
      () => { state.circuits.selectedNodeId = edge.targetId; render(); },
    )))] : null,
    model.chipTypes.has(node.typeKey) ? renderChipTypeEditor(model.chipTypes.get(node.typeKey)) : null,
  ].flat().filter(Boolean);
}

// ---------------------------------------------------------------------------
// Chip type naming
// ---------------------------------------------------------------------------

// The export only stores each chip's type as an ID. Names come from the viewer, saved in this browser.
const CHIP_LABEL_STORAGE_KEY = "room-inspector:chip-type-names";
const OBJECT_FIELDS_IGNORED_FOR_HINTS = new Set([
  "id", "transform", "circuit_node_data", "child_views", "encoded_entity_idx",
  // Present on every room object, so they don't tell chip types apart.
  "spawnable_tool_data", "tool_entity_data", "creation_object_data", "tagged_tool_data", "tool_cleanup_data", "synced_data",
]);

function loadChipLabels() {
  try {
    const stored = localStorage.getItem(CHIP_LABEL_STORAGE_KEY);
    const parsed = stored ? JSON.parse(stored) : {};
    return parsed && typeof parsed === "object" ? parsed : {};
  } catch (error) {
    return {};
  }
}

function saveChipLabels() {
  try {
    localStorage.setItem(CHIP_LABEL_STORAGE_KEY, JSON.stringify(state.chipLabels));
  } catch (error) {
    showToast("Couldn't save names in this browser. Copy them out to keep them.");
  }
}

function setChipLabel(typeKey, label) {
  const trimmed = label.trim();
  if (trimmed) state.chipLabels[typeKey] = trimmed;
  else delete state.chipLabels[typeKey];
  saveChipLabels();
}

function chipTypeKey(version, typeId) {
  return `cv${version}:${typeId || "none"}`;
}

function chipTypeName(typeKey, prefabId) {
  return state.chipLabels[typeKey] || prefabNameFor(prefabId) || null;
}

function chipDisplayName(chip, graph) {
  return chip.name || chipTypeName(chip.typeKey, chip.prefabId) || (graph.version === 1 ? `Chip ${chip.id}` : "(unnamed)");
}

function chipSubtitle(chip) {
  if (chip.innerGraphId) return "board";
  const typeName = chipTypeName(chip.typeKey, chip.prefabId);
  if (chip.name && typeName) return typeName;
  if (typeName) return `#${chip.id}`;
  return chip.typeId ? chip.typeId.slice(0, 13) : "no type";
}

function chipTypeHue(typeKey) {
  let hash = 0;
  for (const character of typeKey) hash = (hash * 31 + character.charCodeAt(0)) >>> 0;
  return hash % 360;
}

function incrementCount(counts, key) {
  counts.set(key, (counts.get(key) || 0) + 1);
}

// Gather clues per chip type: how many pins its wires use, which settings are set, what the room object carries.
function computeChipTypes(graphs) {
  const types = new Map();
  const statsFor = (chip, graph) => {
    let stats = types.get(chip.typeKey);
    if (!stats) {
      stats = {
        key: chip.typeKey,
        version: graph.version,
        typeId: chip.prefabId || chip.typeId,
        isPrefab: Boolean(chip.prefabId),
        nodeTypeIds: new Set(),
        count: 0,
        inputPins: new Set(),
        outputPins: new Set(),
        settings: new Map(),
        objectComponents: new Map(),
        namesSeen: new Set(),
        boardCount: 0,
      };
      types.set(chip.typeKey, stats);
    }
    return stats;
  };

  for (const graph of graphs) {
    const chipsById = new Map(graph.nodes.map((chip) => [chip.id, chip]));
    for (const chip of graph.nodes) {
      const stats = statsFor(chip, graph);
      stats.count++;
      if (chip.typeId) stats.nodeTypeIds.add(chip.typeId);
      if (chip.name) stats.namesSeen.add(chip.name);
      if (chip.innerGraphId) stats.boardCount++;
      for (const entry of chip.message.orderedEntries()) {
        const name = entry.field ? entry.field.name : `#${entry.number}`;
        if (!GENERIC_CHIP_FIELDS.has(name) && !name.startsWith("DEPRECATED_")) incrementCount(stats.settings, name);
      }
      if (chip.objectMessage) {
        for (const entry of chip.objectMessage.orderedEntries()) {
          const name = entry.field ? entry.field.name : `#${entry.number}`;
          if (!OBJECT_FIELDS_IGNORED_FOR_HINTS.has(name)) incrementCount(stats.objectComponents, name);
        }
      }
    }
    for (const edge of graph.edges) {
      const source = chipsById.get(edge.sourceId);
      const target = chipsById.get(edge.targetId);
      const pinLabel = (group, port) => (group === null ? String(port) : `${group}.${port}`);
      if (source) types.get(source.typeKey).outputPins.add(pinLabel(edge.sourceGroup, edge.sourcePort));
      if (target) types.get(target.typeKey).inputPins.add(pinLabel(edge.targetGroup, edge.targetPort));
    }
  }
  return types;
}

function describePins(pins) {
  if (pins.size === 0) return "none wired";
  const sorted = [...pins].sort((first, second) => first.localeCompare(second, undefined, { numeric: true }));
  return `${sorted.join(", ")} (${pins.size} used)`;
}

function describeCounts(counts, total) {
  return [...counts.entries()]
    .sort((first, second) => second[1] - first[1])
    .map(([name, count]) => (count === total ? name : `${name} ×${count}`))
    .join(", ");
}

function renderChipTypeEditor(stats) {
  const prefabName = stats.isPrefab ? prefabNameFor(stats.typeId) : null;
  const nameInput = el("input", {
    class: "text-input",
    value: state.chipLabels[stats.key] || "",
    placeholder: prefabName ? `${prefabName} (from PrefabIds.csv), or type your own name` : "What is this chip? e.g. AND Gate",
    "aria-label": "Name for this chip type",
  });
  const save = () => {
    setChipLabel(stats.key, nameInput.value);
    showToast(nameInput.value.trim() ? `Named ${stats.count} ${stats.count === 1 ? "chip" : "chips"} "${nameInput.value.trim()}"` : "Name cleared");
    render();
  };
  nameInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") save();
  });

  const clues = [
    [stats.isPrefab ? "Prefab ID" : "Type ID", stats.typeId || "none"],
    ...(prefabName ? [["Prefab type", state.prefabNames.get(stats.typeId.toLowerCase())]] : []),
    ...(stats.isPrefab ? [["Node type", [...stats.nodeTypeIds].join(", ") || "none"]] : []),
    ["In this room", `${stats.count} ${stats.count === 1 ? "chip" : "chips"}${stats.boardCount ? `, ${stats.boardCount} as boards` : ""}`],
    [stats.version === 1 ? "Input slots wired" : "Input pins wired", describePins(stats.inputPins)],
    [stats.version === 1 ? "Output slots wired" : "Output pins wired", describePins(stats.outputPins)],
  ];
  if (stats.settings.size > 0) clues.push(["Settings set", describeCounts(stats.settings, stats.count)]);
  if (stats.objectComponents.size > 0) clues.push(["Room object has", describeCounts(stats.objectComponents, stats.count)]);
  if (stats.namesSeen.size > 0) clues.push(["Names given", [...stats.namesSeen].slice(0, 6).map((name) => JSON.stringify(name)).join(", ")]);

  return el("div", { class: "type-editor" },
    el("h3", {}, el("span", { class: "type-swatch", style: `background: hsl(${chipTypeHue(stats.key)} 65% 55%)` }), chipTypeName(stats.key, stats.isPrefab ? stats.typeId : null) || "Unnamed chip type"),
    el("div", { class: "decode-row" }, nameInput, el("button", { class: "button", onclick: save }, "Save name")),
    el("dl", { class: "info-grid" }, clues.map(([term, detail]) => [el("dt", {}, term), el("dd", {}, detail)])),
  );
}

function renderChipTypeList(model) {
  const types = [...model.chipTypes.values()].sort((first, second) => second.count - first.count);
  if (types.length === 0) return null;
  const showVersion = new Set(types.map((stats) => stats.version)).size > 1;
  const typeNameOf = (stats) => chipTypeName(stats.key, stats.isPrefab ? stats.typeId : null);
  const namedCount = types.filter((stats) => typeNameOf(stats)).length;
  return [
    el("div", { class: "result-note" }, `Chip types (${namedCount} of ${types.length} named)`),
    types.map((stats) => el("button", {
      class: "result-item collection-item",
      "aria-current": String(state.circuits.selectedTypeKey === stats.key),
      onclick: () => {
        state.circuits.selectedTypeKey = state.circuits.selectedTypeKey === stats.key ? null : stats.key;
        state.circuits.selectedNodeId = null;
        render();
      },
    },
    el("span", { class: "collection-pattern" },
      el("span", { class: "type-swatch", style: `background: hsl(${chipTypeHue(stats.key)} 65% 55%)` }),
      typeNameOf(stats) || (stats.typeId ? stats.typeId.slice(0, 13) : "no type")),
    el("span", { class: "collection-type" }, `${showVersion ? `CV${stats.version}, ` : ""}${typeNameOf(stats) ? (stats.typeId || "").slice(0, 13) : "unnamed"}`),
    el("span", { class: "collection-count" }, stats.count))),
    el("div", { class: "decode-row label-sharing" },
      el("button", { class: "button is-small", onclick: () => copyText(describeAllChipTypes(types), "chip type clues") }, "Copy clues for all types")),
    renderLabelSharing(),
  ];
}

function describeAllChipTypes(types) {
  return types.map((stats) => {
    const lines = [
      `${chipTypeName(stats.key, stats.isPrefab ? stats.typeId : null) || "unnamed"}: ${stats.isPrefab ? "prefab " : ""}${stats.typeId || "no type"}, CV${stats.version}, ${stats.count} chips${stats.boardCount ? ` (${stats.boardCount} boards)` : ""}`,
      ...(stats.isPrefab ? [`  node type: ${[...stats.nodeTypeIds].join(", ") || "none"}`] : []),
      `  inputs wired: ${describePins(stats.inputPins)}`,
      `  outputs wired: ${describePins(stats.outputPins)}`,
    ];
    if (stats.settings.size > 0) lines.push(`  settings: ${describeCounts(stats.settings, stats.count)}`);
    if (stats.objectComponents.size > 0) lines.push(`  room object: ${describeCounts(stats.objectComponents, stats.count)}`);
    if (stats.namesSeen.size > 0) lines.push(`  names: ${[...stats.namesSeen].slice(0, 6).join(", ")}`);
    return lines.join("\n");
  }).join("\n\n");
}

function renderLabelSharing() {
  const exportArea = el("textarea", { class: "text-input label-share", rows: "4", "aria-label": "Chip type names as JSON" });
  exportArea.value = JSON.stringify(state.chipLabels, null, 1);
  return el("details", { class: "label-sharing" },
    el("summary", {}, "Copy or paste chip names"),
    el("p", { class: "node-meta" }, "Names are saved in this browser and keyed by type ID, so they carry over to other rooms. Paste someone else's list here to use their names."),
    exportArea,
    el("div", { class: "decode-row" },
      el("button", { class: "button is-small", onclick: () => copyText(JSON.stringify(state.chipLabels, null, 1), "chip names") }, "Copy names"),
      el("button", {
        class: "button is-small",
        onclick: () => {
          try {
            const pasted = JSON.parse(exportArea.value);
            if (!pasted || typeof pasted !== "object" || Array.isArray(pasted)) throw new Error("expected an object of type ID to name");
            let applied = 0;
            for (const [typeKey, label] of Object.entries(pasted)) {
              if (typeof label !== "string") continue;
              setChipLabel(typeKey, label);
              applied++;
            }
            showToast(`Applied ${applied} chip names`);
            render();
          } catch (error) {
            showToast(`Couldn't read those names: ${error.message}`);
          }
        },
      }, "Apply pasted names"),
    ),
  );
}

// ---------------------------------------------------------------------------
// Objects tab: every prefab placed in the room
// ---------------------------------------------------------------------------

const OBJECT_LIST_PAGE_SIZE = 200;
let objectModelCache = null;

function vectorOf(message) {
  if (!(message instanceof DecodedMessage)) return null;
  return { x: message.get("x") ?? 0, y: message.get("y") ?? 0, z: message.get("z") ?? 0 };
}

function formatVector(vector) {
  return vector ? `(${formatNumber(vector.x)}, ${formatNumber(vector.y)}, ${formatNumber(vector.z)})` : "none";
}

function shapeMessagesOf(message) {
  if (!(message instanceof DecodedMessage)) return [];
  if (message.typeName === "rec_room.PersistenceViewData") return shapeMessagesOf(message.get("shape_container_data"));
  if (message.typeName === "rec_room.ShapeContainerData") return shapeMessagesOf(message.get("shape_collection"));
  if (message.typeName === "rec_room.ShapeDataCollectionData") return message.get("shapes") || [];
  return [];
}

function buildObjectModel() {
  if (objectModelCache && objectModelCache.root === state.root) return objectModelCache;
  const objects = [];
  walkMessage(state.root, {
    onMessage(message, path) {
      if (message.typeName !== "rec_room.PersistenceViewData") return;
      const transform = message.get("transform");
      const components = message.orderedEntries()
        .map((entry) => (entry.field ? entry.field.name : `#${entry.number}`))
        .filter((name) => !OBJECT_FIELDS_IGNORED_FOR_HINTS.has(name));
      objects.push({
        index: objects.length,
        message,
        path: copyPath(path),
        prefabId: prefabIdOf(message),
        position: vectorOf(transform?.get("position")),
        rotation: transform?.get("quaternion_rotation") || null,
        scale: transform?.get("scale") ?? null,
        components,
        shapeCount: shapeMessagesOf(message).length,
      });
    },
  });

  const groupsByKey = new Map();
  for (const object of objects) {
    const key = object.prefabId || "none";
    if (!groupsByKey.has(key)) groupsByKey.set(key, { key, prefabId: object.prefabId, objects: [] });
    groupsByKey.get(key).objects.push(object);
  }
  const groups = [...groupsByKey.values()].sort((first, second) => second.objects.length - first.objects.length);
  objectModelCache = { root: state.root, objects, groups, groupsByKey };
  return objectModelCache;
}

function groupLabel(group) {
  if (!group.prefabId) return "No prefab ID";
  return prefabNameFor(group.prefabId) || group.prefabId.slice(0, 13);
}

function objectLabel(object) {
  const name = object.prefabId ? prefabNameFor(object.prefabId) : null;
  return name || (object.prefabId ? object.prefabId.slice(0, 13) : "Object");
}

function renderObjects() {
  const model = buildObjectModel();
  if (model.objects.length === 0) return el("div", { class: "panel empty-note" }, "This file has no room objects.");

  const selectedGroup = state.objects.prefabKey ? model.groupsByKey.get(state.objects.prefabKey) : null;
  const sidebar = el("aside", { class: "panel sidebar" },
    el("h3", {}, "Prefabs"),
    el("div", { class: "sidebar-scroll" },
      el("button", {
        class: "result-item collection-item",
        "aria-current": String(!selectedGroup),
        onclick: () => selectObjectGroup(null),
      },
      el("span", { class: "collection-pattern" }, "All objects"),
      el("span", { class: "collection-type" }, `${model.groups.length} prefabs`),
      el("span", { class: "collection-count" }, model.objects.length.toLocaleString())),
      model.groups.map((group) => el("button", {
        class: "result-item collection-item",
        "aria-current": String(group === selectedGroup),
        onclick: () => selectObjectGroup(group.key),
      },
      el("span", { class: "collection-pattern" },
        el("span", { class: "type-swatch", style: `background: hsl(${chipTypeHue(group.key)} 60% 55%)` }),
        groupLabel(group)),
      el("span", { class: "collection-type" }, group.prefabId && prefabNameFor(group.prefabId) ? group.prefabId.slice(0, 13) : group.prefabId ? "unnamed prefab" : "no spawnable_tool_data"),
      el("span", { class: "collection-count" }, group.objects.length.toLocaleString())))),
  );

  return el("div", { class: "split" }, sidebar, renderObjectList(model, selectedGroup));
}

function selectObjectGroup(key) {
  state.objects.prefabKey = key;
  state.objects.selectedIndex = null;
  state.objects.limit = OBJECT_LIST_PAGE_SIZE;
  state.objects.filter = "";
  render();
}

function selectObject(index) {
  state.objects.selectedIndex = state.objects.selectedIndex === index ? null : index;
  render();
}

function renderObjectMap(model, selectedGroup) {
  const placed = model.objects.filter((object) => object.position);
  if (placed.length === 0) return el("div", { class: "empty-note" }, "None of these objects have a saved position.");
  const axis = state.objects.axis;
  const project = (position) => (axis === "xy" ? { horizontal: position.x, vertical: -position.y } : { horizontal: position.x, vertical: -position.z });
  const points = placed.map((object) => ({ object, ...project(object.position) }));
  const horizontalValues = points.map((point) => point.horizontal);
  const verticalValues = points.map((point) => point.vertical);
  const minHorizontal = Math.min(...horizontalValues);
  const minVertical = Math.min(...verticalValues);
  const span = Math.max(Math.max(...horizontalValues) - minHorizontal, Math.max(...verticalValues) - minVertical, 1);
  const padding = span * 0.04;
  const radius = span * 0.006;

  const svg = svgEl("svg", {
    class: "object-map",
    viewBox: `${minHorizontal - padding} ${minVertical - padding} ${Math.max(...horizontalValues) - minHorizontal + padding * 2} ${Math.max(...verticalValues) - minVertical + padding * 2}`,
    preserveAspectRatio: "xMidYMid meet",
    role: "img",
    "aria-label": "Room objects seen from above",
  });
  const background = [];
  const foreground = [];
  for (const point of points) {
    const inGroup = !selectedGroup || (point.object.prefabId || "none") === selectedGroup.key;
    const isSelected = point.object.index === state.objects.selectedIndex;
    const dot = svgEl("circle", {
      cx: point.horizontal,
      cy: point.vertical,
      r: isSelected ? radius * 2.2 : inGroup && selectedGroup ? radius * 1.5 : radius,
      class: `map-dot${inGroup ? " is-in-group" : ""}${isSelected ? " is-selected" : ""}`,
      style: inGroup ? `fill: hsl(${chipTypeHue(point.object.prefabId || "none")} 60% 50%)` : null,
    }, svgEl("title", {}, `${objectLabel(point.object)} ${formatVector(point.object.position)}`));
    dot.addEventListener("click", () => selectObject(point.object.index));
    (inGroup ? foreground : background).push(dot);
  }
  svg.append(...background, ...foreground);
  return el("div", { class: "object-map-frame" }, svg);
}

function renderObjectList(model, selectedGroup) {

        class: "text-input",
        type: "search",

        "aria-label": "Filter objects",
        oninput: (event) => {

}

function renderObjectDetail(object) {
