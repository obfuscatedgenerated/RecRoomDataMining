syntax = "proto3";

package rec_room;

import "rec_room/persistence/overridable_field_data.proto";

option csharp_namespace = "RecRoom.Protobuf";

message PlayerRoomRoleData {
  int32 DEPRECATED_role_id = 1;
  int32 DEPRECATED_role_rank = 2;
  bool DEPRECATED_is_role_active = 3;
  bool DEPRECATED_is_ag_role = 4;
  string role_name = 5;
  .rec_room.OverridableStringData name = 6;
  .rec_room.OverridableBoolData can_assign_roles = 7;
  .rec_room.OverridableIntData vote_kick_permission = 8;
  .rec_room.OverridableBoolData can_invite = 9;
  .rec_room.OverridableBoolData DEPRECATED_can_edit_circuits = 10;
  .rec_room.OverridableBoolData can_start_games = 11;
  .rec_room.OverridableBoolData can_talk = 12;
  .rec_room.OverridableBoolData can_print_photos = 13;
  .rec_room.OverridableBoolData can_edit_room_roles = 14;
  .rec_room.OverridableBoolData can_self_revive = 16;
  .rec_room.OverridableBoolData can_end_games_early = 17;
  .rec_room.OverridableBoolData can_change_game_mode = 21;
  .rec_room.OverridableBoolData can_use_maker_pen = 22;
  .rec_room.OverridableBoolData can_use_delete_all_button = 23;
  .rec_room.OverridableBoolData can_save_inventions = 24;
  .rec_room.OverridableBoolData disable_mic_auto_mute = 25;
  .rec_room.OverridableBoolData can_use_share_cam = 26;
  .rec_room.OverridableBoolData can_spawn_inventions = 28;
  .rec_room.OverridableBoolData can_spawn_consumables = 29;
  .rec_room.OverridableBoolData can_use_room_reset_button = 30;
  .rec_room.OverridableBoolData can_use_play_gizmos_toggle = 31;
  bool is_modified_by_player = 18;
  .rec_room.OverridableListStringData auto_assigned_game_roles = 19;
  int32 role_version = 20;
  string role_guid = 27;
  reserved 15;
}
