syntax = "proto3";

package rec_room;

import "core/vector3_data.proto";
import "rec_room/transform_data.proto";

option csharp_namespace = "RecRoom.Protobuf";

message ObjectGroupDataCollectionData {
  message ObjectGroupDataCollectionEntryData {
    int32 photon_view_id = 1;
    .rec_room.ObjectGroupData object_group = 2;
    int32 revision = 3;
  }
  repeated .rec_room.ObjectGroupDataCollectionData.ObjectGroupDataCollectionEntryData object_groups = 1;
}

message ObjectGroupData {
  repeated bytes group_member_ids = 1;
  oneof typeData {
    .rec_room.CircuitGroupData circuit_group_data = 2;
    .rec_room.AnimationData animation_data = 3;
  }
}

message CircuitGroupData {
  repeated .rec_room.CircuitGroupInterfaceNodeData input_interface_nodes = 1;
  repeated .rec_room.CircuitGroupInterfaceNodeData output_interface_nodes = 2;
  string name = 3;
  repeated .rec_room.TransformData local_transforms = 4;
}

message CircuitGroupInterfaceNodeData {
  .rec_room.CircuitGroupConnectionData internal_connection = 1;
  .rec_room.CircuitGroupConnectionData external_connection = 2;
  string name = 3;
}

message CircuitGroupConnectionData {
  oneof typeData {
    .rec_room.CircuitGroupCircuitReferenceData circuit_reference_data = 1;
    .rec_room.CircuitGroupInterfaceNodeReferenceData interface_node_reference_data = 2;
  }
}

message CircuitGroupCircuitReferenceData {
  bytes circuit_node_id = 1;
  int32 slot = 2;
  bool is_input = 3;
}

message CircuitGroupInterfaceNodeReferenceData {
  bytes circuit_group_id = 1;
  int32 index = 2;
  bool is_input = 3;
}

message ObjectKeyFrameData {
  .core.Vector3Data position = 1;
  .core.Vector3Data rotation = 2;
  int32 flags = 3;
}

message KeyFrameData {
  float time = 1;
  repeated .rec_room.ObjectKeyFrameData object_key_frames = 2;
}

message AnimationData {
  repeated .rec_room.KeyFrameData key_frames = 2;
  int32 speed_percentage = 5;
  int32 priority = 6;
  int32 flags = 7;
}
