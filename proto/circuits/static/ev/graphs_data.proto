syntax = "proto3";

package circuits;

import "circuits/static/core/graph_system/graph_sys_data.proto";
import "circuits/static/core/tree_system/tree_sys_data.proto";

option csharp_namespace = "Circuits.Static.EV.Protobuf";

message GraphsData {
  .circuits.TreeSysData tree = 1;
  repeated .circuits.GraphSysData items = 2;
}
