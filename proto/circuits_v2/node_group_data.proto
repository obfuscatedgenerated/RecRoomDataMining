syntax = "proto3";

package circuits_v2;

import "circuits_v2/deprecated/DEPRECATED_dictionary_data.proto";
import "circuits_v2/deprecated/DEPRECATED_keyed_input_port_data.proto";
import "circuits_v2/deprecated/DEPRECATED_keyed_output_port_data.proto";
import "circuits_v2/input_port_data.proto";

option csharp_namespace = "CircuitsV2.Protobuf";

message NodeGroupData {
  repeated .circuits_v2.InputPortData inputs = 5;
  repeated int32 first_input_indices = 6;
  .circuits_v2.DEPRECATED_ListDictionaryData DEPRECATED_input_ports_0 = 1;
  .circuits_v2.DEPRECATED_ListDictionaryData DEPRECATED_output_ports_0 = 2;
  repeated .circuits_v2.DEPRECATED_KeyedInputPortData DEPRECATED_input_ports_1 = 3;
  repeated .circuits_v2.DEPRECATED_KeyedOutputPortData DEPRECATED_output_ports_1 = 4;
}
