syntax = "proto3";

package circuits_v2;

import "core/guid_data.proto";
import "circuits_v2/node_desc_data.proto";

option csharp_namespace = "CircuitsV2.Protobuf";

message DataTableConfiguredColumnNodeData {
  .core.GuidData table_id = 1;
  int32 column_index = 2;
  .circuits_v2.NodeDescData node_desc = 3;
}
