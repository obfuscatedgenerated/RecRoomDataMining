syntax = "proto3";

package circuits_v2;

import "circuits_v2/circuit_global_entities_data.proto";
import "circuits_v2/circuit_graph_data.proto";
import "circuits_v2/circuit_node_data.proto";
import "circuits_v2/circuit_serialization_version.proto";

option csharp_namespace = "CircuitsV2.Protobuf";

message ControlPanelRootData {
  .circuits_v2.CircuitSerializationVersion version = 1;
  .circuits_v2.CircuitGraphData graph_template = 2;
  .circuits_v2.CircuitGlobalEntitiesData entities = 4;
  .circuits_v2.CircuitNodeData DEPRECATED_node_template = 3;
}
