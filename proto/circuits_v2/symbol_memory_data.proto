syntax = "proto3";

package circuits_v2;

import "core/guid_data.proto";
import "circuits_v2/circuit_signal_data.proto";

option csharp_namespace = "CircuitsV2.Protobuf";

message SymbolMemoryData {
  .core.GuidData guid = 1;
  .circuits_v2.CircuitSignalData home_value = 2;
  .circuits_v2.CircuitSignalData home_value_from_room_load_snapshot_only = 3;
}
