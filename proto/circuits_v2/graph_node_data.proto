syntax = "proto3";

package circuits_v2;

import "core/guid_data.proto";
import "circuits_v2/deprecated/DEPRECATED_dictionary_data.proto";
import "circuits_v2/deprecated/DEPRECATED_keyed_input_node_data.proto";
import "circuits_v2/deprecated/DEPRECATED_keyed_node_desc_data.proto";
import "circuits_v2/deprecated/DEPRECATED_keyed_output_node_data.proto";
import "circuits_v2/node_desc_data.proto";

option csharp_namespace = "CircuitsV2.Protobuf";

message GraphNodeData {
  .core.GuidData inner_graph_id = 13;
  .core.GuidData in_bus_id = 14;
  .core.GuidData out_bus_id = 15;
  repeated .circuits_v2.NodeDescData node_descs = 12;
  bytes DEPRECATED_inner_graph_id = 1;
  .circuits_v2.DEPRECATED_DictionaryData DEPRECATED_input_nodes_0 = 2;
  .circuits_v2.DEPRECATED_DictionaryData DEPRECATED_output_nodes_0 = 3;
  .circuits_v2.DEPRECATED_ListDictionaryData DEPRECATED_node_descs_0 = 4;
  repeated .circuits_v2.DEPRECATED_KeyedInputNodeData DEPRECATED_input_nodes_1 = 5;
  repeated .circuits_v2.DEPRECATED_KeyedOutputNodeData DEPRECATED_output_nodes_1 = 6;
  repeated .circuits_v2.DEPRECATED_KeyedNodeDescData DEPRECATED_node_descs_1 = 7;
  repeated .circuits_v2.DEPRECATED_KeyedInputNodeData DEPRECATED_in_bus_groups = 8;
  repeated .circuits_v2.DEPRECATED_KeyedOutputNodeData DEPRECATED_out_bus_groups = 9;
  bytes DEPRECATED_in_bus_id = 10;
  bytes DEPRECATED_out_bus_id = 11;
}
