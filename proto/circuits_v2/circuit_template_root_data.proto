syntax = "proto3";

package circuits_v2;

import "circuits_v2/circuit_global_entities_data.proto";
import "circuits_v2/circuit_graph_data.proto";
import "circuits_v2/circuit_serialization_version.proto";
import "circuits_v2/data_table/data_table_registry_data.proto";
import "circuits_v2/data_table/data_table_data.proto";
import "circuits_v2/studio_functions/studio_function_signature_registry_data.proto";

option csharp_namespace = "CircuitsV2.Protobuf";

message CircuitTemplateRootData {
  .circuits_v2.CircuitSerializationVersion version = 1;
  .circuits_v2.CircuitGraphData root = 2;
  .circuits_v2.DataTableRegistryData data_table_registry_data = 3;
  .circuits_v2.DataTableData progression_table_data = 4;
  .circuits_v2.StudioFunctionSignatureRegistryData source_studio_function_signature_registry_data = 5;
  .circuits_v2.CircuitGlobalEntitiesData entities = 6;
  .circuits_v2.CircuitTemplateRootData behavior_template = 7;
}
